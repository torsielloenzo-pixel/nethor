<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#242930">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Nethor</title>
<link rel="manifest" href="manifest.webmanifest?v=56">
<link rel="icon" href="assets/app-icon-v63.svg?v=56" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/app-icon-mobile-v74.svg?v=74">
<style>html,body{min-height:100%;margin:0;background:#252a31}body{min-height:100vh;min-height:100dvh} [data-nethor-maintenance-layout]{min-height:100dvh}</style>
<script src="platform-resolver.js?v=3"></script><script src="platform-assets.js?v=4"></script>
<script>window.NethorPlatformAssets.style('ui/desktop/maintenance-layout.css?v=1','ui/mobile/maintenance-layout.css?v=1')</script>
</head>
<body>
<div data-nethor-maintenance-layout></div>
<noscript><div style="min-height:100dvh;display:grid;place-items:center;color:#fff;font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Maintenance Nethor en cours</div></noscript>
<script>window.NethorPlatformAssets.script('ui/desktop/maintenance-layout.js?v=1','ui/mobile/maintenance-layout.js?v=1')</script>
<script src="maintenance-page-layout.js?v=1"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://gioxrpaiwogqqtakjpnv.supabase.co" crossorigin><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
const URL='https://gioxrpaiwogqqtakjpnv.supabase.co';
const KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let checking=false,leaving=false;
function homeTarget(){
 try{
  if(window.NethorPlatform?.isPreview?.())return 'home.html?mobile_preview=1';
  const forced=new URLSearchParams(location.search).get('nethor_platform');
  if(forced==='desktop'||forced==='mobile')return 'home.html?nethor_platform='+forced
 }catch(_){}
 return 'home.html'
}
async function maintenanceState(){
 if(checking||leaving)return;checking=true;
 try{
  const [{data:{session}},{data:setting}]=await Promise.all([
   db.auth.getSession(),
   db.from('app_settings').select('value').eq('key','site_config').maybeSingle()
  ]);
  const cfg=setting?.value&&typeof setting.value==='object'?setting.value:{};
  const enabled=cfg?.maintenance?.enabled===true;
  const page=cfg?.pages?.maintenance;
  if(page&&typeof page==='object'){
   const label=String(page.nav_label||page.label||'Nethor').trim()||'Nethor';
   const subtitle=String(page.subtitle||'Maintenance').trim()||'Maintenance';
   const h1=document.querySelector('.maintenance h1'),sub=document.querySelector('.maintenance .subtitle');
   if(h1)h1.textContent=label;if(sub)sub.textContent=subtitle;document.title=label+' · Nethor'
  }
  if(!session){location.replace('https://nethor.fr/index.html?logout=1&v=115');return}
  const {data:profile}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  if(profile?.role==='admin'){location.replace(homeTarget());return}
  if(!enabled)location.replace(homeTarget())
 }catch(e){console.warn('Maintenance:',e)}
 finally{checking=false}
}
async function leaveMaintenanceToLogin(event){
 if(event)event.preventDefault();
 const target='https://nethor.fr/index.html?logout=1&v=115';
 if(leaving){location.href=target;return false}
 leaving=true;
 const btn=document.getElementById('maintenanceLogout');
 if(btn){btn.classList.add('busy');btn.setAttribute('aria-disabled','true');const label=btn.querySelector('span');if(label)label.textContent='Déconnexion…'}
 try{sessionStorage.setItem('nettoForceLogin','1')}catch(_){}
 const fallback=setTimeout(()=>{location.href=target},900);
 try{
  await Promise.race([
   db.auth.signOut({scope:'local'}),
   new Promise(resolve=>setTimeout(resolve,650))
  ])
 }catch(e){console.warn('Déconnexion:',e)}
 try{
  for(let i=localStorage.length-1;i>=0;i--){
   const key=localStorage.key(i);
   if(key&&key.startsWith('sb-')&&key.includes('auth-token'))localStorage.removeItem(key)
  }
  for(let i=sessionStorage.length-1;i>=0;i--){
   const key=sessionStorage.key(i);
   if(key&&key.startsWith('sb-')&&key.includes('auth-token'))sessionStorage.removeItem(key)
  }
 }catch(_){}
 clearTimeout(fallback);
 location.replace(target);
 return false
}
document.getElementById('maintenanceLogout')?.addEventListener('click',leaveMaintenanceToLogin);
maintenanceState();
setInterval(maintenanceState,15000);
window.addEventListener('focus',maintenanceState);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)maintenanceState()});
</script>
<script>['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});</script>
</body>
</html>
