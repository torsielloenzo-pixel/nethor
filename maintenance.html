<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#242930">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Nethor — Maintenance</title>
<link rel="manifest" href="manifest.webmanifest?v=56">
<link rel="icon" href="assets/app-icon-v54.svg?v=56" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/app-icon-mobile-v71.svg?v=72">
<style>
:root{--bg:#252a31;--bg2:#1f242a;--text:#f7f8fa;--muted:#9ba1ab;--orange:#ff7a24;--red:#ff321f}
*{box-sizing:border-box}\nhtml{width:100%;max-width:100%;overflow-x:hidden;touch-action:pan-x pan-y;overscroll-behavior:none;-webkit-text-size-adjust:100%}body{width:100%;max-width:100%;overflow-x:hidden}
html,body{min-height:100%;margin:0}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:
radial-gradient(circle at 50% 42%,#333941 0,#2b3037 35%,var(--bg) 64%,var(--bg2) 100%);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);overflow:hidden}
.maintenance{width:min(92vw,520px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 24px}
.logo{width:128px;height:128px;display:block;filter:drop-shadow(0 18px 28px #00000032)}
h1{font-size:58px;line-height:1;margin:20px 0 8px;font-weight:900;letter-spacing:-2.6px}
.subtitle{margin:0;color:var(--muted);font-size:17px;font-weight:650;letter-spacing:7px;text-transform:uppercase}
.status{margin-top:30px;min-height:58px;padding:0 23px;display:inline-flex;align-items:center;gap:13px;border-radius:999px;background:linear-gradient(135deg,var(--red),var(--orange));box-shadow:0 14px 34px #ff4f2635;color:#fff;font-size:18px;font-weight:850}
.gear{width:27px;height:27px;display:grid;place-items:center;font-size:27px;line-height:1;transform-origin:50% 50%;animation:gearClockwise 5s linear infinite}
@keyframes gearClockwise{to{transform:rotate(360deg)}}
.glow{position:fixed;width:340px;height:340px;border-radius:50%;background:#ff5a2a08;filter:blur(24px);pointer-events:none}
@media(max-width:560px){.maintenance{padding:24px 18px}.logo{width:104px;height:104px}h1{font-size:45px}.subtitle{font-size:13px;letter-spacing:5px}.status{min-height:52px;padding:0 18px;font-size:16px}.gear{font-size:24px}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="maintenance" aria-live="polite">
 <img class="logo" src="assets/app-icon-v54.svg?v=56" alt="Nethor">
 <h1>Nethor</h1>
 <p class="subtitle">Portail interne</p>
 <div class="status"><span class="gear" aria-hidden="true">⚙</span><span>Maintenance en cours</span></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
const URL='https://gioxrpaiwogqqtakjpnv.supabase.co';
const KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let checking=false;
async function maintenanceState(){
 if(checking)return;checking=true;
 try{
  const [{data:{session}},{data:setting}]=await Promise.all([
   db.auth.getSession(),
   db.from('app_settings').select('value').eq('key','site_config').maybeSingle()
  ]);
  const enabled=setting?.value?.maintenance?.enabled===true;
  if(!session){if(!enabled)location.replace('index.html');return}
  const {data:profile}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  if(profile?.role==='admin'){location.replace('home.html');return}
  if(!enabled)location.replace('home.html')
 }catch(e){console.warn('Maintenance:',e)}
 finally{checking=false}
}
maintenanceState();
setInterval(maintenanceState,15000);
window.addEventListener('focus',maintenanceState);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)maintenanceState()});
</script>
<script>['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});</script>\n</body>
</html>
