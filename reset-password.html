<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<meta name="robots" content="noindex,nofollow">
<title>Nethor · Nouveau mot de passe</title>
<link rel="icon" href="assets/app-icon-v63.svg" type="image/svg+xml">
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('nettoTheme')||'light'}catch(_){document.documentElement.dataset.theme='light'}})();</script>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--card:#fff;--text:#202124;--muted:#737982;--line:#e2e5e9;--soft:#f7f8fa;--accent:#ff5a2a;--accent2:#ff8620;--ok:#188443;--err:#b42318}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111317;--card:#1b1d22;--text:#f2f3f5;--muted:#aeb3bb;--line:#343940;--soft:#202329;--ok:#55c982;--err:#ff8e83}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(255,99,44,.12),transparent 38%),var(--bg);color:var(--text);display:grid;place-items:center;padding:24px}
.shell{width:min(100%,470px)}
.brand{display:flex;align-items:center;justify-content:center;margin-bottom:18px;font-weight:950;font-size:30px;letter-spacing:-1.7px}
.brand .ne{color:#ff642e}.brand .thor{color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(20,24,32,.12)}
.icon{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:950;font-size:22px;box-shadow:0 9px 24px rgba(255,80,35,.24)}
h1{font-size:25px;letter-spacing:-.7px;margin:18px 0 7px}
.lead{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.55}
.fields{display:grid;gap:13px}
.field{display:grid;gap:6px}
label{font-size:10px;font-weight:850;color:var(--muted)}
input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:0 13px;font:inherit;outline:none}
input:focus{border-color:#ff7b52;box-shadow:0 0 0 3px rgba(255,90,42,.12)}
button,a.action{width:100%;height:46px;border:0;border-radius:12px;font:inherit;font-weight:850;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.primary{margin-top:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 9px 24px rgba(255,80,35,.22)}
.primary:disabled{opacity:.55;cursor:not-allowed}
.secondary{margin-top:10px;background:var(--soft);color:var(--text);border:1px solid var(--line)}
.state{min-height:18px;margin-top:12px;font-size:11px;line-height:1.45;color:var(--muted)}
.state.ok{color:var(--ok);font-weight:750}.state.err{color:var(--err);font-weight:750}
.loading{display:flex;align-items:center;gap:9px;padding:13px;border-radius:13px;background:var(--soft);color:var(--muted);font-size:11px;margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 5px rgba(255,90,42,.12)}
.hidden{display:none!important}
.hint{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:10px;line-height:1.55;color:var(--muted)}
@media(max-width:520px){body{padding:14px}.card{padding:21px;border-radius:21px}.brand{font-size:27px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
</head>
<body>
<main class="shell">
  <div class="brand" aria-label="Nethor"><span class="ne">ne</span><span class="thor">thor</span></div>
  <section class="card">
    <div class="icon">N</div>
    <h1>Nouveau mot de passe</h1>
    <p class="lead">Choisis un nouveau mot de passe pour ton compte Nethor.</p>

    <div id="checking" class="loading"><span class="dot"></span><span>Vérification du lien sécurisé…</span></div>

    <div id="resetForm" class="hidden">
      <div class="fields">
        <div class="field">
          <label for="newPassword">Nouveau mot de passe</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="8 caractères minimum">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Retape le nouveau mot de passe">
        </div>
      </div>
      <button id="saveBtn" class="primary" type="button">Modifier mon mot de passe</button>
    </div>

    <div id="state" class="state" aria-live="polite"></div>
    <a id="loginBtn" class="action secondary hidden" href="index.html">Retour à la connexion</a>
    <p class="hint">Pour ta sécurité, ce lien de récupération est personnel. Si tu n’as pas demandé cette modification, ferme simplement cette page.</p>
  </section>
</main>
<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co';
const SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const searchParams=new URLSearchParams(location.search);
const recoveryTokenHash=searchParams.get('token_hash')||'';
const recoveryMarker=/type=recovery/i.test(location.hash)||searchParams.get('type')==='recovery'||!!recoveryTokenHash;
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let recoveryReady=false,finished=false;

function showError(message){
 $('checking').classList.add('hidden');
 $('resetForm').classList.add('hidden');
 $('state').className='state err';
 $('state').textContent=message;
 $('loginBtn').classList.remove('hidden')
}
function enableReset(){
 if(finished||recoveryReady)return;
 recoveryReady=true;
 $('checking').classList.add('hidden');
 $('resetForm').classList.remove('hidden');
 $('state').className='state';
 $('state').textContent='Lien vérifié. Tu peux maintenant choisir ton nouveau mot de passe.';
 setTimeout(()=>$('newPassword').focus(),60)
}

db.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'&&session)enableReset()
});

(async()=>{
 try{
  if(recoveryTokenHash){
   const {data,error}=await db.auth.verifyOtp({token_hash:recoveryTokenHash,type:'recovery'});
   if(error||!data?.session)throw error||new Error('Session de récupération absente');
   try{history.replaceState(null,'',location.pathname)}catch(_){}
   enableReset();
   return;
  }
  const {data:{session}}=await db.auth.getSession();
  if(recoveryMarker&&session)enableReset();
  setTimeout(()=>{if(!recoveryReady&&!finished)showError('Ce lien de réinitialisation est invalide, expiré ou a déjà été utilisé.')},2500)
 }catch(_){showError('Ce lien de réinitialisation est invalide, expiré ou a déjà été utilisé.')}
})();

$('saveBtn').addEventListener('click',async()=>{
 if(!recoveryReady||finished)return;
 const next=$('newPassword').value,confirmValue=$('confirmPassword').value,state=$('state'),btn=$('saveBtn');
 if(next.length<8){state.className='state err';state.textContent='Le mot de passe doit contenir au moins 8 caractères.';return}
 if(next!==confirmValue){state.className='state err';state.textContent='La confirmation ne correspond pas au nouveau mot de passe.';return}
 btn.disabled=true;state.className='state';state.textContent='Modification du mot de passe…';
 try{
  const {error}=await db.auth.updateUser({password:next});
  if(error)throw error;
  try{await db.functions.invoke('password-recovery-email',{body:{action:'resolved'}})}catch(_){}
  finished=true;recoveryReady=false;
  $('resetForm').classList.add('hidden');
  state.className='state ok';
  state.textContent='✓ Mot de passe modifié avec succès. Tu peux maintenant te reconnecter.';
  $('loginBtn').classList.remove('hidden');
  try{await db.auth.signOut({scope:'global'})}catch(_){}
  try{history.replaceState(null,'',location.pathname)}catch(_){}
 }catch(e){
  state.className='state err';
  state.textContent='Impossible de modifier le mot de passe. Le lien a peut-être expiré.';
  btn.disabled=false
 }
});
</script>
</body>
</html>
