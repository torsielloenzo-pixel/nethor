const HOME_WIDGETS=[
 {id:'welcome',label:'Bonjour / espace de travail',description:'Message d’accueil de la page mobile.',icon:'home',displayOnly:true},
 {id:'next_shift',label:'Prise de poste',description:'Prochaine prise de poste calculée depuis le planning.',icon:'planning',displayOnly:true},
 {id:'hours',label:'Mes heures',description:'Total des heures planifiées sur la semaine.',icon:'planning',displayOnly:true},

 {id:'tasks',label:'Tâches du jour',description:'Missions affectées et validation de la journée.',icon:'articles',displayOnly:true},
 {id:'important_info',label:'Informations importantes',description:'Notifications et informations à surveiller.',icon:'notifications',displayOnly:true},
 {id:'team_today',label:'Équipe aujourd’hui',description:'Personnes planifiées aujourd’hui.',icon:'accounts',displayOnly:true},
 {id:'quick_access',label:'Accès rapides',description:'Raccourcis vers les outils accessibles.',icon:'home',displayOnly:true},
 {id:'operations_hub',label:'Pilotage magasin',description:'Relève, service, commandes, livraisons et Flash magasin.',icon:'home',displayOnly:false}
]
function homeWidgetAllowed(id){
 const node=window.NettoProfileUI?.siteConfig?.home_widgets?.[id]||{},def=HOME_WIDGETS.find(x=>x.id===id);
 if(node.enabled===false)return false;
 if(def?.displayOnly)return true;
 const role=profile?.role||'',roleValue=node?.roles?.[role],fallback=id==='operations_hub'?role==='admin':true;
 const roleAllowed=typeof roleValue==='boolean'?roleValue:fallback;
 return roleAllowed||subroleKeys.some(k=>node?.subroles?.[k]===true)
}

 return typeof fn==='function'?fn(item.icon||'home'):'•'
}

 host.querySelectorAll('input[data-home-widget]').forEach(x=>x.onchange=()=>{prefs.home_widgets[x.dataset.homeWidget]=x.checked;markDirty()})

function validMobileTheme(theme){return ['mineral','sage','plum'].includes(theme)?theme:''}
function activeMobileTheme(){return prefs.mobile_mode==='halloween'&&canUseHalloweenTheme()?'halloween':validMobileTheme(prefs.mobile_theme)}
function applyLocalTheme(theme){
 const mobile=settingsIsMobile(),custom=mobile?activeMobileTheme():'';
 const effective=mobile?(['plum','halloween'].includes(custom)?'dark':custom?'light':'light'):(theme==='dark'?'dark':'light');
 const root=document.documentElement;root.dataset.theme=effective;
 if(settingsIsMobile()){
  if(custom)root.dataset.nethorMobileTheme=custom;else delete root.dataset.nethorMobileTheme;
  root.style.colorScheme=effective;
  try{localStorage.setItem('nethorMobileTheme',custom)}catch(_){}
 }
 try{localStorage.setItem('nettoTheme',effective)}catch(_){}
 const colors={mineral:'#edf3f8',sage:'#eef3ef',plum:'#171623',halloween:'#120e17'};
 const meta=document.querySelector('meta[name="theme-color"]');
 if(meta)meta.content=colors[custom]||(effective==='dark'?'#17191d':'#ffffff')
}
function renderThemeChoice(){
 const mobile=settingsIsMobile(),value=mobile?(validMobileTheme(prefs.mobile_theme)||'light'):prefs.theme;
 const choices=mobile?[['themeLight','light'],['themeMineral','mineral'],['themeSage','sage'],['themePlum','plum']]:[['themeLight','light'],['themeDark','dark']];
 choices.forEach(([id,theme])=>{
  const btn=$(id);if(!btn)return;const active=value===theme;
  btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))
 })
}

 if(settingsIsMobile()){
  if(theme==='light')prefs.mobile_theme='';
  else if(validMobileTheme(theme))prefs.mobile_theme=theme;
  else return;
  prefs.mobile_mode='favorite'
 }else if(['light','dark'].includes(theme))prefs.theme=theme;
 else return;

async function savePersonal(){const b=$('saveBtn');b.disabled=true;$('saveState').textContent='Enregistrement…';if(settingsIsMobile()){if(prefs.mobile_theme==='halloween'){prefs.mobile_mode=canUseHalloweenTheme()?'halloween':'favorite';prefs.mobile_theme=''}prefs.mobile_theme=validMobileTheme(prefs.mobile_theme);prefs.mobile_mode=prefs.mobile_mode==='halloween'&&canUseHalloweenTheme()?'halloween':'favorite'}const {error}=await db.from('profiles').update({ui_preferences:prefs}).eq('id',session.user.id);if(error){$('saveState').className='saveState err';$('saveState').textContent='Erreur : '+error.message;window.NettoSounds?.play?.('error')}else{profile.ui_preferences=JSON.parse(JSON.stringify(prefs));$('saveState').className='saveState ok';$('saveState').textContent='✓ Personnalisation enregistrée';window.NettoSounds?.play?.('success');await window.NettoProfileUI?.refresh?.()}b.disabled=false}

async function boot(){const {data:{session:s}}=await db.auth.getSession();session=s;if(!s)return location.replace('index.html');const [{data:p,error},subRes]=await Promise.all([db.from('profiles').select('display_name,role,ui_preferences').eq('id',s.user.id).maybeSingle(),Promise.resolve(db.rpc('my_subrole_keys')).catch(()=>({data:[]}))]);if(error||!p)return location.replace('index.html');profile=p;subroleKeys=(subRes?.data||[]).map(x=>x.subrole_key).filter(Boolean);prefs=ensurePrefs(p.ui_preferences);applyLocalTheme(prefs.theme);$('roleBadge').textContent=window.NettoProfileUI?.roleLabel?.(p.role)||ROLE_LABEL[p.role]||p.role;if(p.role==='admin')$('adminShortcut').classList.remove('hidden');await waitUI();render();$('saveState').textContent='À jour'}
