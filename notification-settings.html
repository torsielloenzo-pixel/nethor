<style>
:root{--ns-bg:#f3f4f6;--ns-card:#fff;--ns-text:#1c2025;--ns-muted:#7b828b;--ns-line:#e4e7eb;--ns-accent:#f15a2b;--ns-soft:#fff1eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--ns-bg);color:var(--ns-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
main{width:min(100%,760px);margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(28px + var(--netto-mobile-bar-h,64px) + env(safe-area-inset-bottom))}
.nsTop{display:flex;align-items:center;gap:11px;margin:2px 2px 16px}
.nsBack{width:42px;height:42px;border:1px solid var(--ns-line);border-radius:14px;background:var(--ns-card);display:grid;place-items:center;color:inherit;font-size:24px;font-weight:700;cursor:pointer}
.nsTitle{min-width:0}.nsTitle h1{margin:0;font-size:28px;letter-spacing:-.8px;line-height:1.05}.nsTitle p{margin:5px 0 0;color:var(--ns-muted);font-size:10px;line-height:1.35}
.nsCard{margin-bottom:13px;background:var(--ns-card);border:1px solid var(--ns-line);border-radius:20px;box-shadow:0 8px 28px rgba(15,23,42,.045);overflow:hidden}
.nsCardHead{padding:15px 16px 10px}.nsCardHead h2{margin:0;font-size:17px}.nsCardHead p{margin:5px 0 0;color:var(--ns-muted);font-size:10px;line-height:1.45}
.pushPanel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin:2px 14px 14px;padding:13px;border:1px solid var(--ns-line);border-radius:15px;background:#f8f9fa}
.pushStatus{display:flex;align-items:flex-start;gap:10px}.pushDot{width:10px;height:10px;border-radius:50%;background:#a4a7ad;box-shadow:0 0 0 4px #a4a7ad18;margin-top:3px;flex:none}.pushStatus.active .pushDot{background:#1b9a50;box-shadow:0 0 0 4px #1b9a5018}.pushStatus.blocked .pushDot{background:#d23b2d;box-shadow:0 0 0 4px #d23b2d18}.pushStatus.warning .pushDot{background:#d88400;box-shadow:0 0 0 4px #d8840018}.pushStatus strong{display:block;font-size:11px}.pushStatus span{display:block;color:#81858c;font-size:9px;line-height:1.4;margin-top:3px}
.pushActions{display:flex;gap:7px}.btn{border:0;border-radius:11px;min-height:40px;padding:0 12px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,#ff3f26,#ff8426);color:#fff;box-shadow:0 7px 18px #ff5a2a22}.danger{background:#fff0ed;color:#ba382b}.hidden{display:none!important}.pushState{padding:0 16px 13px;font-size:9px;color:var(--ns-muted);min-height:13px}.pushInstallHelp{display:none;margin:0 14px 14px;padding:10px 12px;border-radius:12px;background:#fff7ec;border:1px solid #f7d9a9;font-size:9px;line-height:1.45;color:#7a5220}.pushInstallHelp.show{display:block}
.ruleList{display:grid}.ruleRow{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(286px,auto);gap:11px;align-items:center;padding:13px 15px;border-top:1px solid var(--ns-line)}.ruleRow:first-child{border-top:0}.ruleIcon{width:42px;height:42px;border-radius:14px;background:#fff2ec;color:#ef5a2f;display:grid;place-items:center}.ruleIcon svg{width:23px;height:23px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}.ruleCopy{min-width:0}.ruleCopy strong{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;line-height:1.2}.ruleCopy p{margin:4px 0 0;color:var(--ns-muted);font-size:9.5px;line-height:1.4}.ruleCopy small{display:block;margin-top:5px;color:#9a7a68;font-size:8.5px;font-weight:700;line-height:1.35}.ruleBadge{display:inline-flex;align-items:center;min-height:19px;padding:0 6px;border-radius:999px;background:#f2f3f5;color:#777;font-size:7.5px;font-weight:900}.ruleBadge.appOnly{background:#fff0e8;color:#cf5d2d}.ruleBadge.off{background:#ffeceb;color:#bd3b31}
.channelControl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border:1px solid var(--ns-line);border-radius:12px;background:#f0f2f4;min-width:286px}.channelControl.two{grid-template-columns:repeat(2,minmax(0,1fr));min-width:176px}.channelOption{min-height:34px;border:0;border-radius:9px;background:transparent;color:#68707a;padding:0 8px;font-size:8.5px;font-weight:900;white-space:nowrap;cursor:pointer;transition:.15s ease}.channelOption:hover{background:#ffffffb8}.channelOption.active{background:#fff;color:#24292f;box-shadow:0 2px 7px #11182716}.channelOption[data-mode="push"].active{color:#d94d24}.channelOption[data-mode="both"].active{background:linear-gradient(135deg,#ff4828,#ff8426);color:#fff;box-shadow:0 4px 12px #ff5a2a2b}.channelOption[data-mode="off"].active{color:#a23a33;background:#fff0ee}.channelOption:disabled{opacity:.42;cursor:not-allowed}
.nsInfo{margin:0 14px 14px;padding:10px 12px;border-radius:12px;background:#f7f8fa;border:1px solid var(--ns-line);font-size:9px;color:var(--ns-muted);line-height:1.5}
:root[data-theme="dark"]{--ns-bg:#17191d;--ns-card:#22252a;--ns-text:#f1eeea;--ns-muted:#aaa59f;--ns-line:#343940;--ns-soft:#392821}
:root[data-theme="dark"] .pushPanel,:root[data-theme="dark"] .nsInfo{background:#1e2125}

<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let session=null,rules=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const icons={
 planning_changes:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M8 4v3M16 4v3M4 9.5h16"/><path d="M8 13h3M13 13h3M8 16h3"/></svg>',
 direct_message:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 16.5H5a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4.5l-3 2v-2Z"/><path d="M7.5 10.5h5M7.5 13h3.5"/></svg>',
 group_message:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="2.5"/><circle cx="16.5" cy="10" r="2"/><path d="M4.5 18c1.1-2.3 3-3.5 4.5-3.5s3.4 1.2 4.5 3.5"/><path d="M14 18c.7-1.5 2-2.4 3.2-2.4 1.1 0 2.4.9 3.1 2.4"/></svg>',
 absence:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="15" rx="3"/><path d="M8 3v4M16 3v4M5 9h14"/><path d="M9 14h6"/></svg>',
 admin_message:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14v9H10l-4 3v-3H5v-9Z"/><path d="M8 10h8M8 13h5"/></svg>',
 app_update:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M5 18.5h14"/></svg>',
 maintenance:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6.5 3-3 3 3-3 3"/><path d="M16.5 8.5 8 17l-2.5.5L6 15l8.5-8.5"/><path d="M4 20h16"/></svg>',
 security:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10" width="13" height="10" rx="2.5"/><path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"/><path d="M12 14v2.5"/></svg>'
};

function backToUserMenu(){if(window.NethorNavigation?.navigateBack)return window.NethorNavigation.navigateBack();if(window.NettoProfileUI?.backToUserMenu)return window.NettoProfileUI.backToUserMenu();location.href='user-menu.html'}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1}
function isStandalone(){return window.matchMedia?.('(display-mode: standalone)')?.matches===true||navigator.standalone===true}
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function base64UrlToUint8Array(value){const pad='='.repeat((4-value.length%4)%4),base64=(value+pad).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base64),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
function setPushUI(mode,title,text){
 const box=$('pushStatus'),enable=$('pushEnableBtn'),disable=$('pushDisableBtn'),help=$('pushInstallHelp');
 if(!box||!enable||!disable||!help)return;
 box.className='pushStatus'+(mode?' '+mode:'');$('pushStatusTitle').textContent=title;$('pushStatusText').textContent=text;
 enable.classList.toggle('hidden',mode==='active'||mode==='blocked'||mode==='unsupported'||mode==='install');
 disable.classList.toggle('hidden',mode!=='active');
 help.classList.toggle('show',mode==='install');
}
async function currentPushSubscription(){if(!pushSupported())return null;const reg=await navigator.serviceWorker.ready;return reg.pushManager.getSubscription()}
async function syncExistingPushSubscription(){
 if(!pushSupported()||Notification.permission!=='granted')return;
 try{
  const sub=await currentPushSubscription();if(!sub)return;
  await db.functions.invoke('planning-push',{body:{action:'subscribe',subscription:sub.toJSON(),user_agent:navigator.userAgent}})
 }catch(e){console.warn('Synchronisation Push:',e)}
}
async function refreshPushStatus(){
 if(!pushSupported()){setPushUI('unsupported','Non compatible','Ce navigateur ne prend pas en charge les notifications Push.');return}
 if(isIOS()&&!isStandalone()){setPushUI('install','Installation requise','Ajoute Nethor à l’écran d’accueil pour recevoir les notifications sur iPhone.');return}
 try{
  const {data:control}=await db.from('notification_controls').select('enabled').eq('user_id',session.user.id).maybeSingle();
  if(control?.enabled===false){setPushUI('blocked','Notifications désactivées par l’administrateur','Les envois sont suspendus pour ton compte.');return}
 }catch(e){console.warn('Contrôle notifications:',e)}
 if(Notification.permission==='denied'){setPushUI('blocked','Notifications bloquées','Réactive les notifications de Nethor dans les réglages de ton appareil.');return}
 try{
  const sub=await currentPushSubscription();
  if(sub&&Notification.permission==='granted')setPushUI('active','Notifications activées','Les alertes autorisées peuvent être reçues sur cet appareil.');
  else setPushUI('','Notifications désactivées','Active-les pour recevoir les alertes autorisées.');
 }catch(e){setPushUI('warning','État indisponible','Impossible de vérifier l’abonnement Push pour le moment.')}
}
async function enablePushNotifications(){
 const state=$('pushState'),btn=$('pushEnableBtn');state.textContent='';
 if(!pushSupported()||(isIOS()&&!isStandalone())){await refreshPushStatus();return}
 btn.disabled=true;state.textContent='Activation des notifications…';
 try{
  const permission=await Notification.requestPermission();
  if(permission!=='granted'){state.textContent=permission==='denied'?'Autorisation refusée.':'Activation annulée.';await refreshPushStatus();return}
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){
   const {data:keyData,error:keyError}=await db.functions.invoke('planning-push',{body:{action:'public-key'}});
   if(keyError||!keyData?.public_key)throw keyError||new Error('Clé Push indisponible');
   sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:base64UrlToUint8Array(keyData.public_key)});
  }
  const {error}=await db.functions.invoke('planning-push',{body:{action:'subscribe',subscription:sub.toJSON(),user_agent:navigator.userAgent}});
  if(error)throw error;
  state.textContent='✓ Notifications mobiles activées sur cet appareil.';window.NettoSounds?.play?.('success');await refreshPushStatus()
 }catch(e){console.error('Activation Push:',e);state.textContent='Impossible d’activer les notifications pour le moment.';window.NettoSounds?.play?.('error');await refreshPushStatus()}
 finally{btn.disabled=false}
}
async function disablePushNotifications(){
 const state=$('pushState'),btn=$('pushDisableBtn');btn.disabled=true;state.textContent='Désactivation…';
 try{
  const sub=await currentPushSubscription();
  if(sub){try{await db.functions.invoke('planning-push',{body:{action:'unsubscribe',endpoint:sub.endpoint}})}catch(_){}await sub.unsubscribe()}
  state.textContent='Notifications mobiles désactivées sur cet appareil.';window.NettoSounds?.play?.('delete');await refreshPushStatus()
 }catch(e){console.error('Désactivation Push:',e);state.textContent='Impossible de désactiver les notifications.';window.NettoSounds?.play?.('error')}
 finally{btn.disabled=false}
}
function ruleMode(r){
 const portal=r.global_portal_enabled!==false&&r.user_portal_enabled!==false;
 const push=r.push_allowed!==false&&r.global_push_enabled!==false&&r.user_push_enabled!==false;
 if(portal&&push)return'both';
 if(portal)return'portal';
 if(push)return'push';
 return'off'
}
function channelOptions(r){
 const portalAvailable=r.global_portal_enabled!==false;
 const pushAvailable=r.push_allowed!==false&&r.global_push_enabled!==false;
 const current=ruleMode(r),disabled=!r.global_enabled||(!portalAvailable&&!pushAvailable);
 const options=[['off','Aucun']];
 if(portalAvailable)options.push(['portal','Portail']);
 if(pushAvailable)options.push(['push','Push']);
 if(portalAvailable&&pushAvailable)options.push(['both','Les deux']);
 return '<div class="channelControl '+(options.length===2?'two':'')+'" role="group" aria-label="Canal de notification">'+options.map(([mode,label])=>'<button type="button" class="channelOption '+(current===mode?'active':'')+'" data-mode="'+mode+'" aria-pressed="'+(current===mode?'true':'false')+'" '+(disabled?'disabled':'')+' onclick="setPreference(\''+esc(r.rule_key)+'\',\''+mode+'\',this)">'+label+'</button>').join('')+'</div>'
}
function renderRules(){
 const host=$('ruleList');
 if(!rules.length){host.innerHTML='<div class="nsInfo">Aucun type de notification disponible.</div>';return}
 host.innerHTML=rules.map(r=>{
  const globalPortal=r.global_portal_enabled!==false,globalPush=r.push_allowed!==false&&r.global_push_enabled!==false;
  const badge=globalPortal&&globalPush?'<span class="ruleBadge">Push + portail</span>':globalPortal?'<span class="ruleBadge appOnly">Portail uniquement</span>':globalPush?'<span class="ruleBadge">Push uniquement</span>':'';
  const globalBadge=!r.global_enabled||(!globalPortal&&!globalPush)?'<span class="ruleBadge off">Désactivé globalement</span>':'';
  return '<div class="ruleRow"><span class="ruleIcon">'+(icons[r.rule_key]||icons.direct_message)+'</span><div class="ruleCopy"><strong>'+esc(r.label)+badge+globalBadge+'</strong><p>'+esc(r.description||'')+'</p><small>'+esc(r.trigger_text||'')+'</small></div>'+channelOptions(r)+'</div>'
 }).join('')
}
async function loadRules(){
 const host=$('ruleList');host.innerHTML='<div class="nsInfo">Chargement des préférences…</div>';
 const {data,error}=await db.rpc('my_notification_channel_preferences');
 if(error){console.error(error);host.innerHTML='<div class="nsInfo">Impossible de charger les préférences pour le moment.</div>';return}
 rules=Array.isArray(data)?data:[];renderRules()
}
async function setPreference(key,mode,button){
 const row=rules.find(x=>x.rule_key===key);if(!row||!row.global_enabled)return;
 const push=row.push_allowed!==false&&row.global_push_enabled!==false&&(mode==='push'||mode==='both');
 const portal=row.global_portal_enabled!==false&&(mode==='portal'||mode==='both');
 document.querySelectorAll('[data-mode][onclick*="'+CSS.escape(key)+'"]').forEach(x=>x.disabled=true);
 try{
  const {data,error}=await db.rpc('set_my_notification_channels',{p_rule_key:key,p_push_enabled:push,p_portal_enabled:portal});
  if(error||data!==true)throw error||new Error('Enregistrement impossible');
  row.user_push_enabled=push;row.user_portal_enabled=portal;
  row.effective_push_enabled=row.global_enabled&&row.push_allowed!==false&&push;
  row.effective_portal_enabled=row.global_enabled&&portal;
  renderRules();
  window.NettoSounds?.play?.('switch');
  await window.NettoProfileUI?.loadNotificationPreferences?.();
  await window.NettoProfileUI?.loadNotifications?.()
 }catch(e){
  console.error(e);window.NettoSounds?.play?.('error');renderRules()
 }
}
async function boot(){
 const {data:{session:s}}=await db.auth.getSession();session=s;if(!s)return location.replace('index.html');
 await syncExistingPushSubscription();await Promise.all([loadRules(),refreshPushStatus()])
}
boot();
</script>
