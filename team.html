<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7">
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('nettoTheme')||'light'}catch(_){}})();</script>
<title>Nethor — Équipe</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://gioxrpaiwogqqtakjpnv.supabase.co" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="platform-resolver.js?v=3"></script><script src="platform-assets.js?v=4"></script>
<script>window.NethorPlatformAssets.style('ui/desktop/desktop-shell.css?v=9','ui/mobile/mobile-shell.css?v=5')</script>
<script src="platform-navigation.js?v=6"></script>
<script>window.NethorPlatformAssets.script('ui/desktop/desktop-shell.js?v=38','ui/mobile/mobile-shell.js?v=15')</script>

<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/app-icon-v63.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/app-icon-mobile-v74.svg?v=74">
<style>
:root{--tm-bg:#f3f5f7;--tm-card:#fff;--tm-text:#172033;--tm-muted:#6d7889;--tm-line:#dfe5eb;--tm-blue:#2563eb;--tm-blue-soft:#eaf1ff;--tm-green:#158657}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:var(--tm-bg);color:var(--tm-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.hidden{display:none!important}
.teamShell{width:100%;max-width:1560px;margin:0 auto;padding:16px 18px 34px}
.teamCommand{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:78px;padding:15px 17px;border:1px solid var(--tm-line);border-radius:16px;background:var(--tm-card)}.teamMobileBack{display:none}
.teamCommandCopy{display:grid;grid-template-columns:auto 1fr;column-gap:9px;align-items:baseline;min-width:0}.teamCommandCopy>span{grid-column:1/-1;font-size:8px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#8b95a4}.teamCommandCopy>strong{font-size:24px;letter-spacing:-.55px}.teamCommandCopy>small{font-size:10px;font-weight:700;color:var(--tm-muted)}
.teamCommandActions{display:flex;gap:8px;flex:none}.teamCommandActions button{min-height:38px;padding:0 13px;border:1px solid var(--tm-line);border-radius:10px;background:#fff;color:#26344a;font-size:9.5px;font-weight:850;cursor:pointer}.teamCommandActions .primary{background:#172033;color:#fff;border-color:#172033}
.teamSummary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:10px 0}.teamKpi{padding:12px 13px;border:1px solid var(--tm-line);border-radius:13px;background:var(--tm-card)}.teamKpi span{display:block;color:var(--tm-muted);font-size:8.5px;font-weight:800}.teamKpi strong{display:block;margin-top:3px;font-size:20px;letter-spacing:-.35px}
.teamTools{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:9px;margin-bottom:10px}.teamSearch{height:42px;padding:0 13px;border:1px solid var(--tm-line);border-radius:11px;background:#fff;color:var(--tm-text);outline:none}.teamSearch:focus{border-color:#9ab7ea;box-shadow:0 0 0 3px #2563eb12}.teamFilters{display:flex;gap:4px;padding:3px;border:1px solid var(--tm-line);border-radius:11px;background:#fff}.teamFilter{min-height:34px;padding:0 11px;border:0;border-radius:8px;background:transparent;color:#5d697b;font-size:9px;font-weight:850;cursor:pointer}.teamFilter.active{background:#172033;color:#fff}
.teamGrid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px}.teamCard{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:11px;align-items:center;min-height:86px;padding:13px;border:1px solid var(--tm-line);border-radius:14px;background:var(--tm-card);text-align:left;color:inherit;cursor:pointer}.teamCard:hover{border-color:#c8d4e3;background:#fbfcfe}.teamAvatar{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#edf1f5;color:#425169;font-size:12px;font-weight:900;overflow:hidden}.teamAvatar img{width:100%;height:100%;object-fit:cover}.teamOnlineDot{position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;border:2px solid #fff;background:#b2bac6}.teamOnlineDot.online{background:#1ea766}.teamCopy{min-width:0}.teamCopy strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}.teamCopy small{display:block;margin-top:4px;color:var(--tm-muted);font-size:9px}.teamState{padding:5px 7px;border-radius:999px;background:#eef2f6;color:#657287;font-size:7.5px;font-weight:900;white-space:nowrap}.teamState.online{background:#e5f5ec;color:#216f4b}.teamEmpty{grid-column:1/-1;padding:34px 14px;border:1px dashed var(--tm-line);border-radius:14px;background:#fff;text-align:center;color:var(--tm-muted);font-size:10px}
.teamError{margin-top:10px;padding:12px;border:1px solid #f0c9c9;border-radius:12px;background:#fff4f4;color:#9a3f3f;font-size:10px}
@media(max-width:1180px){.teamGrid{grid-template-columns:repeat(3,minmax(220px,1fr))}}
@media(max-width:840px){.teamShell{padding:10px 10px 26px}.teamCommand{align-items:flex-start;flex-direction:column}.teamCommandActions{width:100%}.teamCommandActions button{flex:1}.teamSummary{grid-template-columns:repeat(3,minmax(0,1fr))}.teamGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.teamShell{padding:8px 9px calc(82px + env(safe-area-inset-bottom))}.teamCommand{min-height:0;padding:12px;border-radius:14px;display:grid!important;grid-template-columns:38px minmax(0,1fr);align-items:center!important;gap:9px!important}.teamMobileBack{display:grid;width:38px;height:38px;padding:0;place-items:center;border:1px solid var(--tm-line);border-radius:11px;background:var(--tm-card);color:var(--tm-text);font-size:22px;font-weight:850}.teamCommandCopy{grid-column:2}.teamCommandCopy>strong{font-size:21px}.teamCommandCopy>small{font-size:9px}.teamCommandActions{display:none}.teamSummary{gap:6px}.teamKpi{padding:9px 8px;border-radius:11px}.teamKpi span{font-size:7.5px}.teamKpi strong{font-size:17px}.teamTools{grid-template-columns:1fr}.teamFilters{overflow-x:auto}.teamFilter{flex:none}.teamGrid{grid-template-columns:1fr;gap:7px}.teamCard{min-height:72px;padding:10px;border-radius:12px;grid-template-columns:43px minmax(0,1fr) auto}.teamAvatar{width:43px;height:43px}.teamCopy strong{font-size:12px}}
:root[data-theme="dark"]{--tm-bg:#12171e;--tm-card:#1b222c;--tm-text:#edf2f8;--tm-muted:#a6b0bf;--tm-line:#34404e}
:root[data-theme="dark"] .teamSearch,:root[data-theme="dark"] .teamFilters,:root[data-theme="dark"] .teamCommandActions button{background:#222b36;color:#eef3f9;border-color:#3b4756}:root[data-theme="dark"] .teamCommandActions .primary,:root[data-theme="dark"] .teamFilter.active{background:#eef3f9;color:#172033}:root[data-theme="dark"] .teamCard:hover{background:#202833}:root[data-theme="dark"] .teamAvatar{background:#293440;color:#d9e2ec}:root[data-theme="dark"] .teamOnlineDot{border-color:#1b222c}:root[data-theme="dark"] .teamEmpty{background:#1b222c}
</style>
</head>
<body><div data-nethor-platform-header></div><div data-nethor-platform-lead></div>
<main class="teamShell">
 <section class="teamCommand">
  <button class="teamMobileBack" type="button" id="teamMobileBack" aria-label="Retour">‹</button>
  <div class="teamCommandCopy"><span>Organisation</span><strong>Équipe</strong><small>Annuaire interne et présence en temps réel</small></div>
  <div class="teamCommandActions"><button type="button" onclick="location.href='planning.html'">Voir le planning</button><button class="primary" type="button" onclick="location.href='chat.html'">Ouvrir les messages</button></div>
 </section>
 <section class="teamSummary" aria-label="Synthèse de l'équipe">
  <div class="teamKpi"><span>Comptes actifs</span><strong id="teamTotal">—</strong></div>
  <div class="teamKpi"><span>En ligne</span><strong id="teamOnline">—</strong></div>
  <div class="teamKpi"><span>Rôles représentés</span><strong id="teamRoles">—</strong></div>
 </section>
 <section class="teamTools">
  <input id="teamSearch" class="teamSearch" type="search" placeholder="Rechercher un membre de l’équipe…" autocomplete="off">
  <div class="teamFilters" aria-label="Filtres"><button class="teamFilter active" data-filter="all">Tous</button><button class="teamFilter" data-filter="online">En ligne</button><button class="teamFilter" data-filter="management">Encadrement</button></div>
 </section>
 <section id="teamGrid" class="teamGrid" aria-live="polite"><div class="teamEmpty">Chargement de l’équipe…</div></section>
 <div id="teamError" class="teamError hidden"></div>
</main>
<script src="platform-page-layout.js?v=12"></script>
<script>
(function(){
'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const state={members:[],filter:'all',query:'',api:null};
const initials=name=>String(name||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]?.toUpperCase()).join('')||'?';
const roleLabel=role=>state.api?.roleLabel?.(role)||({admin:'Administrateur','role_point-de-vente':'Point de vente',point_vente:'Point de vente',surface_vente:'Point de vente',responsable:'Responsable',employe:'Employé',lecture:'Lecture seule'}[role]||role||'Utilisateur');
const isManagement=m=>['admin','role_point-de-vente','point_vente','surface_vente','point_de_vente','responsable'].includes(String(m?.role||'').toLowerCase());
async function apiReady(){for(let i=0;i<120;i++){const api=window.NettoProfileUI;if(api?.client&&api?.session){state.api=api;return api}await new Promise(r=>setTimeout(r,50))}return null}
async function avatarUrl(m){if(!m?.avatar_path)return'';try{const {data}=await state.api.client.storage.from('profile-avatars').createSignedUrl(m.avatar_path,3600);return data?.signedUrl||''}catch(_){return''}}
function presenceIds(){return new Set(state.api?.onlineIds||[])}
function visible(){
 const q=state.query.trim().toLocaleLowerCase('fr'),online=presenceIds();
 return state.members.filter(m=>{
  if(state.filter==='online'&&!online.has(m.id))return false;
  if(state.filter==='management'&&!isManagement(m))return false;
  if(!q)return true;
  return [m.display_name,roleLabel(m.role)].some(v=>String(v||'').toLocaleLowerCase('fr').includes(q))
 }).sort((a,b)=>Number(online.has(b.id))-Number(online.has(a.id))||String(a.display_name||'').localeCompare(String(b.display_name||''),'fr',{sensitivity:'base'}))
}
function render(){
 const online=presenceIds(),rows=visible(),roles=new Set(state.members.map(m=>String(m.role||'')).filter(Boolean));
 document.getElementById('teamTotal').textContent=state.members.length;
 document.getElementById('teamOnline').textContent=[...online].filter(id=>state.members.some(m=>m.id===id)).length;
 document.getElementById('teamRoles').textContent=roles.size;
 const grid=document.getElementById('teamGrid');
 if(!rows.length){grid.innerHTML='<div class="teamEmpty">Aucun membre ne correspond à ce filtre.</div>';return}
 grid.innerHTML=rows.map(m=>{const on=online.has(m.id),photo=m.avatar_url?'<img src="'+esc(m.avatar_url)+'" alt="">':esc(initials(m.display_name));return '<button type="button" class="teamCard" data-user="'+esc(m.id)+'"><span class="teamAvatar" '+(m.avatar_frame?'data-avatar-frame="'+esc(m.avatar_frame)+'"':'')+'>'+photo+'<i class="teamOnlineDot '+(on?'online':'')+'"></i></span><span class="teamCopy"><strong>'+esc(m.display_name||'Utilisateur')+'</strong><small>'+esc(roleLabel(m.role))+'</small></span><span class="teamState '+(on?'online':'')+'">'+(on?'EN LIGNE':'HORS LIGNE')+'</span></button>'}).join('')
}
async function load(){
 const api=await apiReady();if(!api){document.getElementById('teamError').textContent='Impossible d’initialiser la session Nethor.';document.getElementById('teamError').classList.remove('hidden');return}
 await api.refresh?.();
 const {data,error}=await api.client.rpc('list_team_members');
 if(error){document.getElementById('teamError').textContent='Impossible de charger l’équipe : '+error.message;document.getElementById('teamError').classList.remove('hidden');return}
 const active=(data||[]).filter(x=>x.account_enabled!==false);
 state.members=await Promise.all(active.map(async m=>({...m,avatar_url:await avatarUrl(m)})));
 render()
}
document.getElementById('teamSearch').addEventListener('input',e=>{state.query=e.target.value;render()});
document.querySelectorAll('.teamFilter').forEach(btn=>btn.addEventListener('click',()=>{state.filter=btn.dataset.filter;document.querySelectorAll('.teamFilter').forEach(x=>x.classList.toggle('active',x===btn));render()}));
document.getElementById('teamGrid').addEventListener('click',e=>{const card=e.target.closest('[data-user]');if(!card)return;const m=state.members.find(x=>x.id===card.dataset.user);if(!m)return;state.api?.openUserCard?.(m,{presenceLabel:()=>presenceIds().has(m.id)?'En ligne':'Hors ligne',messageUrl:'chat.html?user='+encodeURIComponent(m.id)})});
document.getElementById('teamMobileBack')?.addEventListener('click',()=>{if(window.NethorNavigation?.navigateBack)window.NethorNavigation.navigateBack();else location.href='user-menu.html'});
window.addEventListener('netto:presence',()=>render());
load();
})();
</script>
</body></html>
