<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réparation Nethor</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#1d232b;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(90vw,430px);background:#fff;border:1px solid #e2e6ea;border-radius:20px;padding:24px;text-align:center;box-shadow:0 18px 55px #18223518}.mark{width:52px;height:52px;border-radius:15px;margin:auto;background:linear-gradient(135deg,#ff3421,#ff8500);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:900}.spin{margin:18px auto 0;width:28px;height:28px;border:3px solid #eee;border-top-color:#ef522b;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#7b838c}</style></head>
<body><div class="card"><div class="mark">N</div><h1>Réparation Nethor</h1><p id="state">Nettoyage de l’ancien cache…</p><small>La page d’accueil va se rouvrir automatiquement.</small><div class="spin"></div></div>
<script>
(async()=>{
 const state=document.getElementById('state');
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister().catch(()=>false)))
  }
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.filter(k=>/^netto-tools-v\d+$/.test(k)).map(k=>caches.delete(k)))
  }
  state.textContent='Cache réparé · rechargement de v1.20.0…';
 }catch(e){state.textContent='Nettoyage partiel · rechargement…'}
 setTimeout(()=>location.replace('home.html?cache_repaired=1'),500)
})();
</script></body></html>
