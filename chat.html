<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Nethor — Équipe</title>
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('nettoTheme')||'light'}catch(_){}})();</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://gioxrpaiwogqqtakjpnv.supabase.co" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="profile-ui.js?v=81" defer></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/app-icon-v63.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/app-icon-mobile-v71.svg?v=72">
<link rel="stylesheet" href="design-v2.css?v=3">
<link rel="stylesheet" href="design-v3.css?v=3">
<link rel="stylesheet" href="design-v4.css?v=3">
<link rel="stylesheet" href="chat-v2.css?v=1">
<script src="chat-v2.js?v=2" defer></script>
</head>
<body>
<header>
 <div class="top">
  <div class="brand">
   <button class="mark" type="button" onclick="location.href='home.html'" aria-label="Accueil Nethor">N</button>
   <div><div class="title">Équipe</div><div class="sub">Messagerie interne</div></div>
  </div>
 </div>
</header>

<main class="chatApp">
 <aside class="conversationListPane">
  <div class="listHead">
   <div><h1>Discussions</h1><small>Équipe Nethor</small></div>
   <button class="newChatBtn" type="button" onclick="openNewChat()" aria-label="Nouvelle discussion" title="Nouvelle discussion">＋</button>
  </div>
  <div class="convSearchWrap"><input id="conversationSearch" class="convSearch" type="search" placeholder="Rechercher une discussion…" oninput="searchConversations(this.value)" autocomplete="off"></div>
  <div id="conversationList" class="conversationList"><div class="listEmpty">Chargement des discussions…</div></div>
 </aside>

 <section class="conversationPane">
  <div class="chatHeader">
   <button class="mobileBack" type="button" onclick="closeMobileConversation()" aria-label="Retour aux discussions">‹</button>
   <div id="activeAvatarMount"></div>
   <div class="activeIdentity"><strong id="activeTitle">Sélectionne une discussion</strong><small id="activeSubtitle"></small></div>
   <div class="chatHeadActions">
    <button id="messageSearchBtn" class="headIconBtn" type="button" onclick="toggleMessageSearch()" aria-label="Rechercher dans la conversation" disabled>⌕</button>
    <button id="infoBtn" class="headIconBtn" type="button" onclick="openConversationInfo()" aria-label="Informations de la conversation" disabled>ⓘ</button>
   </div>
  </div>
  <div id="messageSearchBar" class="messageSearchBar"><input id="messageSearchInput" type="search" placeholder="Rechercher dans les messages…" oninput="searchMessages(this.value)" autocomplete="off"><button type="button" onclick="toggleMessageSearch()">×</button></div>
  <div id="messages" class="messages"><div class="noConversation"><div><div class="logo"><img src="assets/logo-equipe.svg" alt=""></div><strong>Messagerie Nethor</strong><span>Choisis une discussion ou crée une conversation.</span></div></div></div>
  <div id="typingLine" class="typingLine"></div>
  <div id="composer" class="composer hidden">
   <div id="composeBanner" class="composeBanner"><div><strong id="composeBannerTitle"></strong><span id="composeBannerText"></span></div><button type="button" onclick="cancelComposeMode()">×</button></div>
   <div id="attachPreview" class="attachPreview"><span id="attachName"></span><button type="button" onclick="clearAttachment()">×</button></div>
   <div class="composeRow">
    <button class="composeIcon" type="button" onclick="document.getElementById('file').click()" aria-label="Joindre un fichier" title="Joindre un fichier">＋</button>
    <input id="file" type="file" hidden accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.xls,.xlsx" onchange="selectAttachment(this)">
    <button id="micBtn" class="composeIcon" type="button" onclick="toggleRecording()" aria-label="Message vocal" title="Message vocal">🎙</button>
    <textarea id="message" rows="1" maxlength="5000" placeholder="Écrire un message…" oninput="composerInput()" onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" class="sendBtn" type="button" onclick="sendMessage()" aria-label="Envoyer">↑</button>
   </div>
  </div>
 </section>
</main>

<div id="reactionPicker" class="reactionPicker hidden">
 <button type="button" onclick="pickReaction('👍')">👍</button>
 <button type="button" onclick="pickReaction('❤️')">❤️</button>
 <button type="button" onclick="pickReaction('😂')">😂</button>
 <button type="button" onclick="pickReaction('😮')">😮</button>
 <button type="button" onclick="pickReaction('✅')">✅</button>
</div>

<div id="newChatModal" class="modalBackdrop hidden" onclick="if(event.target===this)closeNewChat()">
 <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="newChatTitle">
  <div class="modalHead"><div><strong id="newChatTitle">Nouvelle discussion</strong><small>Conversation privée ou groupe</small></div><button class="modalClose" type="button" onclick="closeNewChat()">×</button></div>
  <div class="modeTabs"><button class="active" data-chat-mode="direct" type="button" onclick="setNewChatMode('direct')">Discussion privée</button><button data-chat-mode="group" type="button" onclick="setNewChatMode('group')">Nouveau groupe</button></div>
  <input id="groupName" class="groupNameInput hidden" type="text" maxlength="80" placeholder="Nom du groupe">
  <input id="newChatSearch" class="modalSearch" type="search" placeholder="Rechercher un membre…" oninput="renderNewChatMembers()" autocomplete="off">
  <div id="newChatMembers" class="modalMembers"></div>
  <button id="createGroupBtn" class="modalAction hidden" type="button" onclick="createGroup()">Créer le groupe</button>
 </div>
</div>

<div id="infoModal" class="modalBackdrop hidden" onclick="if(event.target===this)closeConversationInfo()">
 <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
  <div class="modalHead"><div><strong id="infoTitle">Informations</strong><small>Discussion et participants</small></div><button class="modalClose" type="button" onclick="closeConversationInfo()">×</button></div>
  <div id="infoContent"></div>
 </div>
</div>

<div id="imageLightbox" class="imageLightbox hidden" onclick="closeImage(event)"><button class="lightboxClose" type="button" onclick="closeImage(event)">×</button><img id="lightboxImage" alt="Aperçu"></div>
</body>
</html>
