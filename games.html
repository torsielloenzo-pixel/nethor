(()=>{'use strict';const db=supabase.createClient('https://gioxrpaiwogqqtakjpnv.supabase.co','sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),overlay=document.getElementById('gameOverlay'),host=document.getElementById('gameHost'),title=document.getElementById('gameName');let active='';
