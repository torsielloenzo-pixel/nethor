<body><div data-nethor-platform-header></div><div data-nethor-platform-lead></div><div data-nethor-accounts-layout></div><script src="platform-page-layout.js?v=12"></script>
<dialog id="subroleDialog"><div class="modal"><h2>Créer un sous-rôle</h2><div class="formGrid"><div class="field"><label>Nom interne</label><input id="newSubroleLabel" maxlength="40" placeholder="Ex. Référent F&L"></div></div><div id="newSubroleState" class="state"></div><div class="modalActions"><button class="btn secondary" onclick="$('subroleDialog').close()">Annuler</button><button id="createSubroleBtn" class="btn primary" onclick="createSubrole()">Créer le sous-rôle</button></div></div></dialog>
<dialog id="roleDialog"><div class="modal"><h2>Créer un rôle</h2><div class="formGrid"><div class="field"><label>Nom du rôle</label><input id="newRoleLabel" maxlength="40" placeholder="Ex. Responsable adjoint"></div></div><div id="newRoleState" class="state"></div><div class="modalActions"><button class="btn secondary" onclick="$('roleDialog').close()">Annuler</button><button id="createRoleBtn" class="btn primary" onclick="createCustomRole()">Créer le rôle</button></div></div></dialog>
<dialog id="createDialog"><div class="modal"><h2>Créer un compte</h2><div class="formGrid"><div class="field"><label>Nom affiché</label><input id="createName" placeholder="Ex. Lucas Martin"></div><div class="field"><label>Identifiant</label><input id="createUsername" autocomplete="off" placeholder="Ex. lucas"></div><div class="field"><label>Mot de passe temporaire</label><input id="createPassword" type="password" autocomplete="new-password" minlength="8" placeholder="8 caractères minimum"></div><div class="field"><label>Rôle</label><select id="createRole"></select></div><div class="field"><label>Nom correspondant dans le planning</label><select id="createPlanningName"><option value="">Aucun lien planning</option></select><span class="fieldHelp">Optionnel · relie le compte à une ligne des plannings importés.</span></div><div class="field"><label>Cadre d’avatar</label><div class="avatarFramePicker"><input id="createAvatarFrame" type="hidden" value=""><button type="button" class="avatarFrameChoice none selected" data-frame="" aria-pressed="true" onclick="setAvatarFrameChoice('createAvatarFrame','',this)"><span class="avatarFramePreview">NT</span><span><strong>Aucun cadre</strong><small>Photo simple</small></span></button><button type="button" class="avatarFrameChoice" data-frame="admin" aria-pressed="false" onclick="setAvatarFrameChoice('createAvatarFrame','admin',this)"><span class="avatarFramePreview" data-avatar-frame="admin">NT</span><span><strong>Administrateur</strong><small>Rouge · couronne</small></span></button><button type="button" class="avatarFrameChoice" data-frame="responsable" aria-pressed="false" onclick="setAvatarFrameChoice('createAvatarFrame','responsable',this)"><span class="avatarFramePreview" data-avatar-frame="responsable">NT</span><span><strong>Responsable</strong><small>Orangé · étoile</small></span></button><button type="button" class="avatarFrameChoice" data-frame="point_vente" aria-pressed="false" onclick="setAvatarFrameChoice('createAvatarFrame','point_vente',this)"><span class="avatarFramePreview" data-avatar-frame="point_vente">NT</span><span><strong>Point de vente</strong><small>Orange · magasin</small></span></button><button type="button" class="avatarFrameChoice" data-frame="employe" aria-pressed="false" onclick="setAvatarFrameChoice('createAvatarFrame','employe',this)"><span class="avatarFramePreview" data-avatar-frame="employe">NT</span><span><strong>Employé</strong><small>Orange · profil</small></span></button><button type="button" class="avatarFrameChoice" data-frame="lecture" aria-pressed="false" onclick="setAvatarFrameChoice('createAvatarFrame','lecture',this)"><span class="avatarFramePreview" data-avatar-frame="lecture">NT</span><span><strong>Lecture seule</strong><small>Graphite · œil</small></span></button></div></div></div><div id="createState" class="state"></div><div class="modalActions"><button class="btn secondary" onclick="$('createDialog').close()">Annuler</button><button id="createBtn" class="btn primary" onclick="createAccount()">Créer</button></div></div></dialog>
