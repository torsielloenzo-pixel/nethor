main{width:min(94vw,1120px);margin:auto;padding:28px 0 60px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}.hero h1{margin:0;font-size:32px;letter-spacing:-.8px}.hero p{margin:7px 0 0;color:#74767b;max-width:740px;font-size:13px;line-height:1.5}.badge{background:#171717;color:#fff;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 25px #00000008}.panel h2{font-size:16px;margin:0}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panelHead small{color:#8a8c91;font-size:10px}
.aiCard{background:linear-gradient(135deg,#171717,#292a2e);color:#fff;border:0}.aiTop{display:flex;gap:12px}.aiIcon{width:44px;height:44px;border-radius:13px;background:#fff;color:#171717;display:grid;place-items:center;font-size:20px;font-weight:900}.aiCard h2{color:#fff}.aiCard p{font-size:12px;line-height:1.5;color:#d4d5d8}.aiStatus{margin-top:14px;border:1px solid #ffffff1c;background:#ffffff0b;border-radius:13px;padding:12px}.aiStatus strong{display:block;font-size:12px}.aiStatus span{display:block;color:#c7c8cb;font-size:10px;margin-top:4px;line-height:1.4}

.analysis{margin-top:16px}.analysisGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:#f6f7f8;border:1px solid #e6e7e9;border-radius:12px;padding:11px}.metric b{display:block;font-size:18px}.metric small{font-size:8.5px;color:#898b90}.assistantFeed{display:grid;gap:8px;margin-top:12px}.assistantMsg{border-left:3px solid var(--red);background:#fafafa;border-radius:0 11px 11px 0;padding:10px 11px;font-size:10px;line-height:1.45}.empty{color:#999;font-size:10px;padding:8px 0}

<script>
const URL='https://gioxrpaiwogqqtakjpnv.supabase.co',KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
let db=null;
async function waitForSupabase(ms=8000){
 const started=Date.now();
 while(Date.now()-started<ms){
  if(window.supabase?.createClient)return window.supabase;
  await new Promise(r=>setTimeout(r,40))
 }
 throw new Error('Supabase indisponible')
}
let session=null,profile=null,siteConfig={},files=[];
const REQUIRED=[
 {id:'ventes',icon:'📈',label:'Ventes',desc:'Idéalement 7 à 28 jours, article par article.',required:true},
 {id:'stock',icon:'▦',label:'Stock actuel',desc:'Quantités disponibles au moment du calcul.',required:true,internal:true},
 {id:'casse_dons',icon:'♻',label:'Casse & dons',desc:'Permet d’éviter de surcommander les produits fragiles.',required:false},
 {id:'commandes',icon:'🛒',label:'Commandes précédentes',desc:'Aide à mesurer les écarts entre commandé et vendu.',required:false},
 {id:'referentiel',icon:'▤',label:'Référentiel produit',desc:'EAN13, conditionnement, capacité rayon et statut.',required:true,internal:true}
];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtBytes(n){n=Number(n)||0;if(n<1024)return n+' o';if(n<1048576)return (n/1024).toFixed(1)+' Ko';return (n/1048576).toFixed(1)+' Mo'}
function classify(name,headers=[]){const s=(name+' '+headers.join(' ')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(/vente|ca |quantite vend|ticket|sortie/.test(s))return'ventes';if(/casse|don|perte|jet|too.?good/.test(s))return'casse_dons';if(/commande|reception|livraison/.test(s))return'commandes';if(/stock|inventaire/.test(s))return'stock';if(/ean|article|referentiel|produit/.test(s))return'referentiel';return'autre'}
function detectDates(rows){let dates=[];for(const row of rows.slice(0,500)){for(const v of Object.values(row||{})){let d=null;if(v instanceof Date)d=v;else if(typeof v==='string'&&/^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/.test(v)){const p=v.match(/\d+/g);if(p){let y=Number(p[2]);if(y<100)y+=2000;d=new Date(y,Number(p[1])-1,Number(p[0]))}}if(d&&!isNaN(d)&&d.getFullYear()>2020&&d.getFullYear()<2100)dates.push(d)}}if(!dates.length)return[null,null];dates.sort((a,b)=>a-b);const f=d=>fDate(d);return[f(dates[0]),f(dates[dates.length-1])]}
function fDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let xlsxRuntimePromise=null;
function loadXlsxRuntime(){
 if(window.XLSX)return Promise.resolve(window.XLSX);
 if(xlsxRuntimePromise)return xlsxRuntimePromise;
 xlsxRuntimePromise=new Promise((resolve,reject)=>{
  const existing=document.querySelector('script[data-nethor-xlsx-runtime="1"]');
  const ready=()=>window.XLSX?resolve(window.XLSX):reject(new Error('Lecteur Excel indisponible'));
  if(existing){
   existing.addEventListener('load',ready,{once:true});
   existing.addEventListener('error',()=>reject(new Error('Chargement Excel impossible')),{once:true});
   return
  }
  const script=document.createElement('script');
  script.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
  script.async=true;
  script.dataset.nethorXlsxRuntime='1';
  script.onload=ready;
  script.onerror=()=>reject(new Error('Chargement Excel impossible'));
  document.head.appendChild(script)
 }).catch(err=>{xlsxRuntimePromise=null;throw err});
 return xlsxRuntimePromise
}
async function inspectFile(file){const XLSX=await loadXlsxRuntime(),buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:true}),sheetNames=wb.SheetNames||[];let total=0,headers=[],sample=[];for(const sn of sheetNames.slice(0,12)){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null});total+=rows.length;if(!headers.length&&rows[0])headers=Object.keys(rows[0]);sample.push(...rows.slice(0,60))}const period=detectDates(sample);return{sheetNames,rowCount:total,headers:headers.slice(0,80),periodStart:period[0],periodEnd:period[1],category:classify(file.name,headers)}}
async function uploadOne(file){if(file.size>15728640)throw new Error(file.name+' dépasse 15 Mo.');const info=await inspectFile(file),path=session.user.id+'/'+Date.now()+'-'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await db.storage.from('fl-analysis').upload(path,file,{upsert:false,contentType:file.type||undefined});if(up.error)throw up.error;const ins=await db.from('fl_analysis_files').insert({uploaded_by:session.user.id,file_name:file.name,storage_path:path,mime_type:file.type||null,file_size:file.size,category:info.category,sheet_names:info.sheetNames,row_count:info.rowCount,columns:info.headers,period_start:info.periodStart,period_end:info.periodEnd,summary:{detected_category:info.category}});if(ins.error){await db.storage.from('fl-analysis').remove([path]);throw ins.error}}
let fileUploadBusy=false;
async function handleFiles(list){
 if(fileUploadBusy)return;
 const arr=[...list];if(!arr.length)return;
 const st=document.getElementById('uploadState'),invalid=arr.find(f=>!(/\.(xls|xlsx|csv)$/i.test(f.name||'')));
 if(invalid){st.textContent='Erreur : format non pris en charge pour '+invalid.name+'. Formats acceptés : XLS, XLSX ou CSV.';return}
 fileUploadBusy=true;
 try{
  for(let i=0;i<arr.length;i++){st.textContent='Analyse et envoi '+(i+1)+'/'+arr.length+' : '+arr[i].name;try{await uploadOne(arr[i])}catch(e){st.textContent='Erreur : '+e.message;await refreshAll();return}}
  st.textContent='✓ '+arr.length+' fichier'+(arr.length>1?'s':'')+' analysé'+(arr.length>1?'s':'')+' et enregistré'+(arr.length>1?'s':'')+'.';window.NettoSounds?.play?.('success');await refreshAll()
 }finally{fileUploadBusy=false}
}
async function loadFiles(){const {data,error}=await db.from('fl_analysis_files').select('*').order('created_at',{ascending:false}).limit(100);if(error)throw error;files=data||[]}
async function deleteFile(id){const f=files.find(x=>x.id===id);if(!f||!confirm('Supprimer ce fichier de l’analyse ?'))return;const del=await db.from('fl_analysis_files').delete().eq('id',id);if(del.error)return alert(del.error.message);await db.storage.from('fl-analysis').remove([f.storage_path]);await refreshAll()}
async function openFile(id){const f=files.find(x=>x.id===id);if(!f)return;const {data,error}=await db.storage.from('fl-analysis').createSignedUrl(f.storage_path,60);if(error)return alert('Ouverture impossible.');window.open(data.signedUrl,'_blank','noopener')}
async function internalStats(){const {data,error}=await db.from('products').select('id,on_sale,quantity,ean,packaging_count,shelf_capacity,family:product_families(name)');if(error)return{stock:false,referentiel:false,total:0,active:0};const fl=(data||[]).filter(p=>String(p.family?.name||'').toLowerCase().includes('fruit'));return{stock:fl.length>0,referentiel:fl.some(p=>p.ean||p.packaging_count||p.shelf_capacity),total:fl.length,active:fl.filter(p=>p.on_sale!==false).length,zero:fl.filter(p=>p.on_sale!==false&&Number(p.quantity)===0).length}}
function renderFiles(){const box=document.getElementById('files');if(!files.length){box.innerHTML='<div class="empty">Aucun fichier transmis pour le moment.</div>';return}box.innerHTML=files.map(f=>'<div class="fileRow"><div class="fileIcon">📊</div><div><strong>'+esc(f.file_name)+'</strong><small>'+fmtBytes(f.file_size)+' • '+f.row_count+' lignes'+(f.sheet_names?.length?' • '+f.sheet_names.length+' feuille'+(f.sheet_names.length>1?'s':''):'')+(f.period_start?' • '+new Date(f.period_start+'T12:00:00').toLocaleDateString('fr-FR')+(f.period_end&&f.period_end!==f.period_start?' → '+new Date(f.period_end+'T12:00:00').toLocaleDateString('fr-FR'):''):'')+'</small></div><div class="fileActions"><span class="fileTag">'+esc(f.category.replace('_',' + '))+'</span><button class="fileOpen" onclick="openFile(\''+f.id+'\')" title="Consulter">↗</button><button class="fileDelete" onclick="deleteFile(\''+f.id+'\')" title="Supprimer">×</button></div></div>').join('')}
async function renderAssistant(){const stats=await internalStats(),cats=new Set(files.map(f=>f.category));const available={ventes:cats.has('ventes'),stock:stats.stock||cats.has('stock'),casse_dons:cats.has('casse_dons'),commandes:cats.has('commandes'),referentiel:stats.referentiel||cats.has('referentiel')};document.getElementById('needs').innerHTML=REQUIRED.map(n=>'<div class="need '+(available[n.id]?'ok':(!n.required?'optional':''))+'"><div class="needIcon">'+n.icon+'</div><div><strong>'+n.label+'</strong><small>'+n.desc+(n.internal&&available[n.id]?' • Base interne détectée':'')+'</small></div><span class="needState">'+(available[n.id]?'Disponible':n.required?'Requis':'Conseillé')+'</span></div>').join('');
 const required=REQUIRED.filter(n=>n.required),ready=required.filter(n=>available[n.id]).length,pct=Math.round(ready/required.length*100);document.getElementById('readinessTitle').textContent=pct===100?'Base minimale prête pour le calcul':'Préparation des données : '+pct+'%';document.getElementById('readinessText').textContent=pct===100?'Les sources minimales sont disponibles. Les fichiers de casse/dons et de commandes rendront les futures recommandations plus précises.':'Il manque : '+required.filter(n=>!available[n.id]).map(n=>n.label).join(', ')+'.';
 document.getElementById('metrics').innerHTML='<div class="metric"><b>'+files.length+'</b><small>fichiers transmis</small></div><div class="metric"><b>'+files.reduce((n,f)=>n+(Number(f.row_count)||0),0)+'</b><small>lignes détectées</small></div><div class="metric"><b>'+stats.active+'</b><small>articles F&L actifs</small></div><div class="metric"><b>'+stats.zero+'</b><small>stocks à zéro</small></div>';
 const msgs=[];if(!available.ventes)msgs.push('Commence par me donner un export de ventes. Une période de 7 jours permet un premier calcul, 28 jours améliore fortement la tendance.');if(available.ventes&&!available.casse_dons)msgs.push('Les ventes sont disponibles. Ajoute la casse et les dons pour que je puisse repérer les articles où la demande apparente est trompeuse.');if(available.casse_dons&&!available.commandes)msgs.push('Avec les commandes précédentes, je pourrai comparer commandé, vendu et perdu afin de corriger les surcommandes récurrentes.');if(pct===100)msgs.push('La base minimale est prête. Prochaine étape : mapper précisément les colonnes produit/EAN13/quantité/date de tes exports Mercalys afin de générer une vraie proposition de précommande par article.');document.getElementById('assistantFeed').innerHTML=msgs.map(x=>'<div class="assistantMsg">'+esc(x)+'</div>').join('')||'<div class="assistantMsg">Je n’ai rien d’autre à demander pour le moment.</div>'}
async function refreshAll(){await loadFiles();renderFiles();await renderAssistant()}
function assistantAllowed(role){
 const page=siteConfig?.pages?.fl_assistant||{};
 if(page.enabled===false)return false;
 const explicit=siteConfig?.role_permissions?.fl_assistant?.[role];
 if(['none','view','operate','manage'].includes(explicit))return explicit!=='none';
 if(Array.isArray(page.roles))return page.roles.includes(role);
 return ['admin','responsable'].includes(role)
}
function applyAssistantPageConfig(){
 const page=siteConfig?.pages?.fl_assistant;if(!page||typeof page!=='object')return;
 const label=String(page.nav_label||page.label||'Assistant Précommande').trim()||'Assistant Précommande';
 const subtitle=String(page.subtitle||'Analyse dédiée • Fruits & Légumes').trim();
 const head=document.querySelector('.brand strong'),headSub=document.querySelector('.brand small'),hero=document.querySelector('.hero h1');
 if(head)head.textContent=label;if(headSub&&subtitle)headSub.textContent=subtitle;if(hero)hero.textContent=page.label||label;
 document.title=label+' · Nethor'
}
async function boot(){
 await waitForSupabase();
 db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data:{session:s}}=await db.auth.getSession();session=s;if(!s)return location.replace('index.html');
 const [{data:p},{data:setting}]=await Promise.all([
  db.from('profiles').select('role,display_name').eq('id',s.user.id).maybeSingle(),
  db.from('app_settings').select('value').eq('key','site_config').maybeSingle()
 ]);
 profile=p;siteConfig=setting?.value&&typeof setting.value==='object'?setting.value:{};
 if(!p||!assistantAllowed(p.role))return location.replace('home.html');
 applyAssistantPageConfig();await refreshAll()
}
const input=document.getElementById('fileInput'),drop=document.getElementById('drop');input.addEventListener('change',()=>{handleFiles(input.files);input.value=''});['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>handleFiles(e.dataTransfer.files));boot().catch(e=>{console.error(e);document.getElementById('readinessTitle').textContent='Erreur de chargement';document.getElementById('readinessText').textContent=e.message});
</script>
