<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fmt=n=>Number(n)%1?String(Number(n)).replace('.',','):String(Number(n));
let profile=null,canManageBakery=false,families=[],categories=[],packagings=[],products=[],bakeryId=null,mode='stock',search='',activeCat='Tous',optionType=null;
function slug(v){return String(v||'').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'-et-').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
async function boot(){
 const {data:{session}}=await db.auth.getSession();if(!session)return location.replace('index.html');
 const {data:p}=await db.from('profiles').select('display_name,role').eq('id',session.user.id).maybeSingle();if(!p||p.role!=='admin')return location.replace('home.html');profile=p;window.currentRole='admin';
 await loadTaxonomy();await loadProducts();const qs=new URLSearchParams(location.search);if(qs.get('ean')){const item=products.find(x=>String(x.ean||'')===qs.get('ean'));if(item)setTimeout(()=>openInfo(item.id),80)}render()
}
async function loadTaxonomy(){
 const [f,c,p]=await Promise.all([db.from('product_families').select('*').order('position'),db.from('product_categories').select('*').order('position'),db.from('product_packagings').select('*').order('position')]);
 if(f.error||c.error||p.error)throw new Error('Référentiel indisponible');
 families=f.data||[];categories=c.data||[];packagings=p.data||[];bakeryId=(families.find(x=>x.slug==='boulangerie')||families.find(x=>x.name==='Boulangerie'))?.id||null;
 fillSelects()
}
function bakeryCats(){return categories.filter(x=>String(x.family_id)===String(bakeryId)).sort((a,b)=>(a.position||0)-(b.position||0))}
function fillSelects(){
 const fam=families.filter(x=>String(x.id)===String(bakeryId)).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('pFamily').innerHTML=fam;if($('infoFamily'))$('infoFamily').innerHTML=fam;
 const cats=bakeryCats(),packs=packagings.slice().sort((a,b)=>(a.position||0)-(b.position||0));
 ['pCat','infoCat'].forEach(id=>{$(id).innerHTML=cats.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')});
 ['pPackaging','infoPackaging'].forEach(id=>{$(id).innerHTML=packs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')})
}
async function loadProducts(){
 const {data,error}=await db.from('products').select('*,product_categories(id,name,icon,color,family_id),product_packagings(id,name)').eq('active',true).eq('family_id',bakeryId).order('position').order('name');
 if(error)throw error;products=(data||[]).map(p=>({...p,category:p.category_id?(p.product_categories?.name||p.category||'Non répertorié'):'Non répertorié',packaging:p.packaging_id?(p.product_packagings?.name||p.packaging||'Non répertorié'):'Non répertorié'}))
}
function setMode(v,opts={}){v=['stock','consult','manage'].includes(v)?v:'stock';if(!canManageBakery)v='consult';mode=v;activeCat='Tous';document.querySelectorAll('.modeBtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===v));try{localStorage.setItem('nettoBakeryMode',v)}catch(_){ }const u=new URL(location.href);u.searchParams.set('mode',v);history.replaceState({},'',u);render();if(opts.sound!==false)window.NettoSounds?.play?.('switch')}
function visible(){return products.filter(p=>(activeCat==='Tous'||p.category===activeCat)&&(!search||[p.name,p.category,p.packaging,p.article_code,p.ean].some(v=>String(v||'').toLocaleLowerCase('fr').includes(search))))}
function toolbar(){
 const cats=['Tous',...bakeryCats().map(x=>x.name).filter(n=>products.some(p=>p.category===n))];
 return '<div class="toolbar" style="grid-template-columns:minmax(0,1fr) '+(mode==='consult'?'auto':'')+'"><input class="search" placeholder="Rechercher un article…" oninput="search=this.value.trim().toLocaleLowerCase(\'fr\');render()">'+(mode==='consult'?'<button class="addBtn" onclick="openAdd()">＋ Ajouter</button>':'')+'</div><div class="catBar">'+cats.map(x=>'<button class="catBtn '+(activeCat===x?'active':'')+'" onclick="activeCat=\''+x.replace(/'/g,"\\'")+'\';render()">'+esc(x)+'</button>').join('')+'</div>'
}
function render(){
 const w=$('work');if(mode==='manage')return renderManage();
 const list=visible(),cats=bakeryCats();
 let html=toolbar();
 if(mode==='stock'){
   cats.forEach(cat=>{const arr=list.filter(p=>p.category===cat.name);if(!arr.length)return;html+='<div class="sectionHead">'+(cat.icon||'🥖')+' '+esc(cat.name)+' <small>('+arr.length+')</small></div><div class="rows">'+arr.map(p=>rowHtml(p)).join('')+'</div>'});
 }else{
   html+='<div class="consultGrid">'+list.map(p=>cardHtml(p)).join('')+'</div>';
 }
 if(!list.length)html+='<div class="empty">Aucun article dans cette sélection.</div>';w.innerHTML=html
}
function rowHtml(p){const pic=p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'🥖';return '<article class="row '+(Number(p.quantity)===0?'zero':'')+'" data-id="'+p.id+'"><div class="pic">'+pic+'</div><div class="info"><strong>'+esc(p.name)+'</strong><small>'+esc(p.category)+' • '+esc(p.packaging)+'</small></div><div class="qty"><button onclick="change(\''+p.id+'\',-.5)">−</button><b>'+fmt(p.quantity)+'</b><button onclick="change(\''+p.id+'\',.5)">+</button></div></article>'}
function cardHtml(p){const pic=p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'🥖';return '<button class="card" onclick="openInfo(\''+p.id+'\')"><div class="cardVisual">'+pic+'</div><div class="cardBody"><strong>'+esc(p.name)+'</strong><small>'+esc(p.category)+' • '+esc(p.packaging)+'</small></div><div class="cardFoot"><span>Stock '+fmt(p.quantity)+'</span><span class="badge '+(p.on_sale===false?'off':'')+'">'+(p.on_sale===false?'Inactif':'Actif')+'</span></div></button>'}
async function change(id,d){if(!canManageBakery)return;const p=products.find(x=>x.id===id);if(!p)return;const old=Number(p.quantity)||0,v=d>0?(old===0?.5:old===.5?1:Math.floor(old)+1):(old<=.5?0:old<=1?.5:Math.max(1,Math.ceil(old)-1));p.quantity=v;render();const {error}=await db.from('products').update({quantity:v}).eq('id',id);if(error){p.quantity=old;render();alert('Modification refusée.')}}
function openAdd(){if(!canManageBakery)return;$('pName').value='';$('pQty').value='0';$('pPackagingCount').value='';$('pShelfCapacity').value='';$('pCode').value='';$('pEan').value='';$('pOnSale').value='true';$('pPhoto').value='';fillSelects();$('addDialog').showModal()}
async function saveProduct(e){
 e.preventDefault();const btn=e.submitter;btn.disabled=true;
 try{let photo_url=null,file=$('pPhoto').files[0];if(file){const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase(),path=crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:false});if(error)throw error;photo_url=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
 const rawEan=$('pEan').value.replace(/\D/g,'');if(rawEan.length>13)throw new Error('L’EAN13 doit contenir au maximum 13 chiffres.');const ean=rawEan?rawEan.padStart(13,'0'):'';const pc=Number($('pPackagingCount').value),scRaw=$('pShelfCapacity').value.trim(),sc=scRaw===''?null:Number(scRaw);const max=products.reduce((m,p)=>Math.max(m,Number(p.position)||0),0),payload={name:$('pName').value.trim(),family_id:bakeryId,category_id:Number($('pCat').value)||null,packaging_id:Number($('pPackaging').value)||null,packaging_count:Number.isInteger(pc)&&pc>=1?pc:null,shelf_capacity:Number.isInteger(sc)&&sc>=0?sc:null,article_code:$('pCode').value.trim()||null,ean:ean||null,on_sale:$('pOnSale').value==='true',quantity:Math.max(0,Number($('pQty').value)||0),photo_url,position:max+1};
 const {error}=await db.from('products').insert(payload);if(error)throw error;$('addDialog').close();await loadProducts();render()
 }catch(err){alert('Ajout impossible : '+err.message)}finally{btn.disabled=false}
}
function renderInfoView(p){const photo=p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'🥖',unit=p.packaging_count?esc(p.packaging_count)+' unité'+(Number(p.packaging_count)>1?'s':''):'Non renseigné',cap=p.shelf_capacity!=null?esc(p.shelf_capacity)+' unités':'Non renseigné';$('infoView').innerHTML='<div class="articleHero">'+photo+'</div><div class="articleName">'+esc(p.name)+'</div><div class="articleMeta">Boulangerie • '+esc(p.category)+'</div><div class="articleInfoGrid"><div class="articleInfoBox"><small>Référence EAN13</small><strong>'+(p.ean?esc(p.ean):'Non renseignée')+'</strong></div><div class="articleInfoBox"><small>Code article</small><strong>'+(p.article_code?esc(p.article_code):'Non renseigné')+'</strong></div><div class="articleInfoBox"><small>Type de conditionnement</small><strong>'+esc(p.packaging)+'</strong></div><div class="articleInfoBox"><small>Nombre par unité de stock</small><strong>'+unit+'</strong></div><div class="articleInfoBox"><small>Capacité rayon</small><strong>'+cap+'</strong></div></div>'}
function setInfoEdit(edit){$('infoView').classList.toggle('hidden',edit);$('infoEditFields').classList.toggle('hidden',!edit);$('editInfoBtn').classList.toggle('hidden',edit)}
function openInfo(id){const p=products.find(x=>x.id===id);if(!p)return;fillSelects();$('infoId').value=id;$('infoName').value=p.name||'';$('infoCat').value=p.category_id?String(p.category_id):'';$('infoPackaging').value=p.packaging_id?String(p.packaging_id):'';$('infoPackagingCount').value=p.packaging_count||'';$('infoShelfCapacity').value=p.shelf_capacity??'';$('infoCode').value=p.article_code||'';$('infoEan').value=p.ean||'';$('infoOnSale').value=String(p.on_sale!==false);$('infoPhoto').value='';$('infoPhotoStatus').textContent=p.photo_url?'Photo actuelle enregistrée':'Aucune photo';renderInfoView(p);setInfoEdit(false);$('infoDialog').showModal()}
async function saveInfo(e){e.preventDefault();const id=$('infoId').value,current=products.find(x=>x.id===id);try{let photoUrl=current?.photo_url||null,file=$('infoPhoto').files[0];if(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''),path=crypto.randomUUID()+'.'+ext;const {error:upErr}=await db.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:false});if(upErr)throw upErr;photoUrl=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}const rawEan=$('infoEan').value.replace(/\D/g,'');if(rawEan.length>13)throw new Error('L’EAN13 doit contenir au maximum 13 chiffres.');const ean=rawEan?rawEan.padStart(13,'0'):'';const pc=Number($('infoPackagingCount').value),scRaw=$('infoShelfCapacity').value.trim(),sc=scRaw===''?null:Number(scRaw);const changes={name:$('infoName').value.trim(),family_id:bakeryId,category_id:Number($('infoCat').value)||null,packaging_id:Number($('infoPackaging').value)||null,packaging_count:Number.isInteger(pc)&&pc>=1?pc:null,shelf_capacity:Number.isInteger(sc)&&sc>=0?sc:null,photo_url:photoUrl,article_code:$('infoCode').value.trim()||null,ean:ean||null,on_sale:$('infoOnSale').value==='true'};const {error}=await db.from('products').update(changes).eq('id',id);if(error){if(error.code==='23505')throw new Error('Cet EAN13 est déjà associé à une autre fiche article.');throw error}$('infoDialog').close();await loadProducts();render()}catch(err){alert('Modification impossible : '+err.message)}}
function renderManage(){
 const on=products.filter(p=>p.on_sale!==false).length,zero=products.filter(p=>p.on_sale!==false&&Number(p.quantity)===0).length;
 $('work').innerHTML='<div class="manageHero"><strong>Gestion Boulangerie</strong><p>Articles, catégories et conditionnements de la famille.</p></div><div class="stats"><div class="stat"><b>'+products.length+'</b><small>articles</small></div><div class="stat"><b>'+on+'</b><small>actifs</small></div><div class="stat"><b>'+zero+'</b><small>stock à 0</small></div></div><div class="manageGrid"><button class="manageAction" onclick="openAdd()"><span>＋</span><strong>Ajouter un article</strong><small>Créer un produit directement dans la famille Boulangerie.</small></button><button class="manageAction" onclick="openOptions(\'category\')"><span>▤</span><strong>Catégories</strong><small>Créer, renommer ou supprimer Pains, Viennoiseries, etc.</small></button><button class="manageAction" onclick="openOptions(\'packaging\')"><span>▣</span><strong>Conditionnements</strong><small>Gérer les conditionnements communs à tous les articles.</small></button><button class="manageAction" onclick="location.href=\'index.html?mode=manage\'"><span>◫</span><strong>Familles</strong><small>Ouvrir la gestion globale des familles.</small></button></div>'
}
function openOptions(kind){optionType=kind;$('optionsTitle').textContent=kind==='category'?'Catégories Boulangerie':'Conditionnements';$('optionLabel').textContent=kind==='category'?'Nouvelle catégorie':'Nouveau conditionnement';$('optionName').value='';$('optionFamilyWrap').classList.toggle('hidden',kind!=='category');if(kind==='category'){$('optionFamily').innerHTML='<option value="'+bakeryId+'">Boulangerie</option>'}renderOptions();$('optionsDialog').showModal()}
function renderOptions(){const l=$('optionsList'),rows=optionType==='category'?bakeryCats():packagings;l.innerHTML=rows.length?rows.map(x=>'<div class="optionRow" data-id="'+x.id+'"><input value="'+esc(x.name)+'"><button class="secondary" onclick="renameOption('+x.id+',this.previousElementSibling.value)">Renommer</button><button class="danger" onclick="deleteOption('+x.id+',\''+String(x.name).replace(/'/g,"\\'")+'\')">Supprimer</button></div>').join(''):'<div class="empty">Aucun élément.</div>'}
async function addOption(){const name=$('optionName').value.trim();if(!name)return;const q=optionType==='category'?db.from('product_categories').insert({family_id:bakeryId,name,icon:'🥖',color:'#c58a4d',position:(bakeryCats().length+1)*10}):db.from('product_packagings').insert({name,position:(packagings.length+1)*10});const {error}=await q;if(error)return alert(error.message);await loadTaxonomy();await loadProducts();$('optionName').value='';renderOptions();if(mode==='manage')renderManage()}
async function renameOption(id,name){name=String(name||'').trim();if(!name)return;const table=optionType==='category'?'product_categories':'product_packagings';const {error}=await db.from(table).update({name}).eq('id',id);if(error)return alert(error.message);await loadTaxonomy();await loadProducts();renderOptions();if(mode==='manage')renderManage()}
async function deleteOption(id,name){if(!confirm('Supprimer « '+name+' » ?\n\nLes articles concernés resteront enregistrés et passeront en « Non répertorié ».'))return;const table=optionType==='category'?'product_categories':'product_packagings';const {error}=await db.from(table).delete().eq('id',id);if(error)return alert(error.message);await loadTaxonomy();await loadProducts();renderOptions();if(mode==='manage')renderManage()}
boot().catch(e=>{console.error(e);$('work').innerHTML='<div class="empty">Impossible de charger la Boulangerie.</div>'});
</script>
</body></html>
