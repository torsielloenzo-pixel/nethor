<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Animation Nethor</title>
<style>
html,body,#root{width:100%;height:100%;margin:0}
html,body{overflow:hidden;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
#root{display:grid;place-items:center}
#fallback{display:none;width:100%;height:100%;place-items:center;color:#ff7900;font:900 min(40vw,64px)/1 sans-serif}
#error{display:none;padding:8px;text-align:center;color:#9aa0a8;font:600 10px/1.35 sans-serif}
</style>
</head>
<body>
<div id="root"></div><div id="fallback">n</div><div id="error"></div>
<script>
(function(){
 const q=new URLSearchParams(location.search),src=q.get('src')||'',requestedTag=(q.get('tag')||'').toLowerCase(),name=q.get('name')||'Utilisateur',theme=q.get('theme')==='dark'?'dark':'light',mode=q.get('mode')==='full'?'full':'media';
 document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;
 const root=document.getElementById('root'),fallback=document.getElementById('fallback'),error=document.getElementById('error');
 function fail(message){root.replaceChildren();fallback.style.display='grid';error.textContent=message||'';error.style.display=message?'block':'none'}
 function allowed(url){
  try{
   const u=new URL(url);
   return u.protocol==='https:'&&u.hostname==='gioxrpaiwogqqtakjpnv.supabase.co'&&u.pathname.includes('/storage/v1/object/public/portal-assets/')
  }catch(_){return false}
 }
 function apiTag(){
  if(requestedTag&&customElements.get(requestedTag))return requestedTag;
  /* Les 10 animations Nethor autonomes utilisent nethor-welcome-01…10.
     On interroge directement le registre Custom Elements : c'est plus fiable
     que l'énumération de window dans un iframe sandboxé. */
  for(let i=1;i<=99;i++){
   const tag='nethor-welcome-'+String(i).padStart(2,'0');
   if(customElements.get(tag))return tag
  }
  for(const key of Object.getOwnPropertyNames(window)){
   if(!/^NethorWelcome(?:\d+|Animation)$/.test(key))continue;
   const tag=String(window[key]?.tag||'').toLowerCase();
   if(tag&&customElements.get(tag))return tag
  }
  return''
 }
 function removeReducedMotionOverrides(rootNode){
  try{
   for(const style of rootNode.querySelectorAll('style')){
    const sheet=style.sheet;if(!sheet)continue;
    for(let i=sheet.cssRules.length-1;i>=0;i--){
     const rule=sheet.cssRules[i],text=String(rule?.conditionText||rule?.media?.mediaText||'').toLowerCase();
     if(text.includes('prefers-reduced-motion'))sheet.deleteRule(i)
    }
   }
  }catch(_){}
 }
 function fit(el,{replay=false}={}){
  const dark=theme==='dark';
  el.style.display='block';el.style.width='100%';el.style.height='100%';el.style.minHeight='0';
  el.style.colorScheme=theme;
  el.style.setProperty('--bg','transparent','important');
  el.style.setProperty('--nethor-bg','transparent','important');
  el.style.setProperty('--fg',dark?'#f7f7f8':'#171717','important');
  el.style.setProperty('--nethor-text',dark?'#f7f7f8':'#171717','important');
  el.style.setProperty('--muted',dark?'#9ba0a8':'#7d8188','important');
  el.style.setProperty('--line',dark?'rgba(255,255,255,.10)':'rgba(0,0,0,.09)','important');
  if(!el.shadowRoot)return;
  removeReducedMotionOverrides(el.shadowRoot);
  if(mode==='media'&&!el.shadowRoot.querySelector('[data-nethor-host-patch]')){
   const patch=document.createElement('style');patch.dataset.nethorHostPatch='1';
   patch.textContent=':host{display:block!important;width:100%!important;height:100%!important;min-height:0!important;background:transparent!important;color-scheme:'+theme+'!important}.stage,.nethor-welcome{width:100%!important;height:100%!important;min-height:0!important;padding:0!important;background:transparent!important;overflow:hidden!important}.wrap,.nethor-welcome__inner,.nethor-inner{width:100%!important;height:100%!important;display:grid!important;place-items:center!important}.logo,.logo-box,.nethor-logo,.nethor-logo-box{width:min(78vw,130px)!important;max-width:92%!important;margin:0!important}.copy,.nethor-copy,.controls,.tag{display:none!important}';
   el.shadowRoot.appendChild(patch)
  }
  if(replay){
   try{el.replay?.()}catch(_){}
  }
 }
 if(!allowed(src)){fail('Source refusée');return}
 const script=document.createElement('script');script.src=src;script.async=true;
 script.onload=function(){
  const tag=apiTag();if(!tag){fail('Format JS Nethor non reconnu');return}
  try{
   const el=document.createElement(tag);el.setAttribute('name',name);root.replaceChildren(el);
   requestAnimationFrame(()=>fit(el,{replay:true}));
   setTimeout(()=>fit(el),80);
   setTimeout(()=>fit(el),260)
  }catch(e){fail('Animation indisponible')}
 };
 script.onerror=function(){fail('Chargement impossible')};
 document.head.appendChild(script)
})();
</script>
</body>
</html>
