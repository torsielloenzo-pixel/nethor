async function currentPushSubscription(){if(!pushSupported())return null;const reg=await navigator.serviceWorker.ready;return reg.pushManager.getSubscription()}
async function syncExistingPushSubscription(){

 try{
   const sub=await currentPushSubscription();if(!sub)return;
   await db.functions.invoke('planning-push',{body:{action:'subscribe',subscription:sub.toJSON(),user_agent:navigator.userAgent}});
 }catch(e){console.warn('Synchronisation Push:',e)}
}
async function refreshPushStatus(){
 if(!pushSupported()){setPushUI('unsupported','Non compatible','Ce navigateur ne prend pas en charge les notifications Push.');return}
 if(isIOS()&&!isStandalone()){setPushUI('install','Installation requise','Ajoute Nethor à l’écran d’accueil pour recevoir les notifications sur iPhone.');return}
 try{
   const {data:control}=await db.from('notification_controls').select('enabled').eq('user_id',session.user.id).maybeSingle();
   if(control?.enabled===false){setPushUI('blocked','Notifications désactivées par l’administrateur','Les envois sont actuellement suspendus pour ton compte.');return}
 }catch(e){console.warn('Contrôle notifications:',e)}
 if(Notification.permission==='denied'){setPushUI('blocked','Notifications bloquées','Réactive les notifications de Nethor dans les Réglages de l’iPhone.');return}
 try{
   const sub=await currentPushSubscription();
   if(sub&&Notification.permission==='granted')setPushUI('active','Notifications activées','Les alertes du portail peuvent être reçues sur cet appareil.');
   else setPushUI('','Notifications désactivées','Active-les pour recevoir les alertes du portail.');
 }catch(e){setPushUI('warning','État indisponible','Impossible de vérifier l’abonnement Push pour le moment.')}
}
async function enablePushNotifications(){
 const state=$('pushState'),btn=$('pushEnableBtn');state.textContent='';
 if(!pushSupported()){await refreshPushStatus();return}
 if(isIOS()&&!isStandalone()){await refreshPushStatus();return}
 btn.disabled=true;state.textContent='Activation des notifications…';
 try{
   const permission=await Notification.requestPermission();
   if(permission!=='granted'){state.textContent=permission==='denied'?'Autorisation refusée. Tu peux la réactiver dans les Réglages iOS.':'Activation annulée.';await refreshPushStatus();return}
   const reg=await navigator.serviceWorker.ready;
   let sub=await reg.pushManager.getSubscription();
   if(!sub){
     const {data:keyData,error:keyError}=await db.functions.invoke('planning-push',{body:{action:'public-key'}});
     if(keyError||!keyData?.public_key)throw keyError||new Error('Clé Push indisponible');
     sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:base64UrlToUint8Array(keyData.public_key)});
   }
   const json=sub.toJSON();
   const {error}=await db.functions.invoke('planning-push',{body:{action:'subscribe',subscription:json,user_agent:navigator.userAgent}});
   if(error)throw error;
   state.textContent='✓ Notifications mobiles activées sur cet appareil.';window.NettoSounds?.play?.('success');await refreshPushStatus();
 }catch(e){console.error('Activation Push:',e);state.textContent='Impossible d’activer les notifications pour le moment.';window.NettoSounds?.play?.('error');await refreshPushStatus()}
 finally{btn.disabled=false}
}
async function disablePushNotifications(){
 const state=$('pushState'),btn=$('pushDisableBtn');btn.disabled=true;state.textContent='Désactivation…';
 try{
   const sub=await currentPushSubscription();
   if(sub){
     try{await db.functions.invoke('planning-push',{body:{action:'unsubscribe',endpoint:sub.endpoint}})}catch(_){}
     await sub.unsubscribe();
   }
   state.textContent='Notifications mobiles désactivées sur cet appareil.';window.NettoSounds?.play?.('delete');await refreshPushStatus();
 }catch(e){console.error('Désactivation Push:',e);state.textContent='Impossible de désactiver les notifications.';window.NettoSounds?.play?.('error')}
 finally{btn.disabled=false}
}

let recoveryEmailConfigured=false,recoveryEmailBusy=false;
async function invokeProfileEmail(body){
 const {data,error}=await db.functions.invoke('profile-email',{body});
 if(error){
  let message=data?.error||data?.message||'';
  try{
   const response=error.context;
   if(!message&&response){
    const copy=response.clone?response.clone():response,type=copy.headers?.get?.('content-type')||'';
    if(type.includes('application/json')){const payload=await copy.json();message=payload?.error||payload?.message||''}
    else{const txt=await copy.text();if(txt)message=txt.slice(0,300)}
   }
  }catch(_){}
  throw new Error(message||error.message||'Action impossible')
 }
 if(data?.error)throw new Error(data.error);
 return data||{}
}
function renderRecoveryEmail(mode){

 empty.classList.toggle('hidden',current!=='empty');
 configured.classList.toggle('hidden',current!=='configured');
 change.classList.toggle('hidden',current!=='change')
}

function validRecoveryEmail(value){
 const v=String(value||'').trim().toLowerCase();
 return v.length>=5&&v.length<=254&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)&&!/@stock-fl\.local$/i.test(v)
}
async function saveRecoveryEmail(changing){
 if(recoveryEmailBusy)return;
 const state=$('recoveryEmailState'),btn=$(changing?'recoveryEmailChangeBtn':'recoveryEmailSaveBtn');
 const oldEmail=changing?$('recoveryEmailOld').value.trim().toLowerCase():'';
 const newEmail=$(changing?'recoveryEmailNext':'recoveryEmailNew').value.trim().toLowerCase();
 state.textContent='';
 if(changing&&!validRecoveryEmail(oldEmail)){state.textContent='Renseigne correctement l’ancienne adresse e-mail.';window.NettoSounds?.play?.('warning');return}
 if(!validRecoveryEmail(newEmail)){state.textContent='Renseigne une adresse e-mail valide.';window.NettoSounds?.play?.('warning');return}
 if(changing&&oldEmail===newEmail){state.textContent='La nouvelle adresse doit être différente de l’ancienne.';window.NettoSounds?.play?.('warning');return}
 recoveryEmailBusy=true;if(btn)btn.disabled=true;state.textContent=changing?'Vérification et modification de l’adresse…':'Enregistrement de l’adresse…';
 try{
  const data=await invokeProfileEmail({action:'save',old_email:oldEmail,new_email:newEmail});
  recoveryEmailConfigured=true;
  $('recoveryEmailNew').value='';$('recoveryEmailOld').value='';$('recoveryEmailNext').value='';
  renderRecoveryEmail('configured');
  if(data.mail_status==='sent')state.textContent='✓ Adresse e-mail enregistrée. Un e-mail vient de t’être envoyé.';
  else if(data.mail_status==='not_configured')state.textContent='✓ Adresse e-mail enregistrée. L’envoi automatique d’e-mail n’est pas encore configuré.';
  else state.textContent='✓ Adresse e-mail enregistrée, mais l’e-mail de confirmation n’a pas pu être envoyé.';
  window.NettoSounds?.play?.('success')
 }catch(e){
  state.textContent='Erreur : '+(e?.message||'enregistrement impossible.');
  window.NettoSounds?.play?.('error')
 }finally{recoveryEmailBusy=false;if(btn)btn.disabled=false}
}

  window.NettoSounds?.play?.('error')
 }finally{recoveryEmailBusy=false}
}

async function openProfileNotification(id,url){await db.from('planning_notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('user_id',session.user.id);if(url)location.href=url;else loadNotifications()}
async function deleteProfileNotification(id){const {error}=await db.from('planning_notifications').delete().eq('id',id).eq('user_id',session.user.id);if(!error){window.NettoSounds?.play?.('delete');await loadNotifications();await window.NettoProfileUI?.loadNotifications?.()}}
async function markAllNotificationsRead(){window.NettoSounds?.play?.('confirm');const {error}=await db.from('planning_notifications').update({read_at:new Date().toISOString()}).eq('user_id',session.user.id).is('read_at',null);if(!error){loadNotifications();window.NettoProfileUI?.loadNotifications?.()}}

let rewardCatalog=[],rewardEquipment=[];
const rewardSelectIds={avatar:'rewardAvatar',frame:'rewardFrame',accessory:'rewardAccessory',title:'rewardTitleSelect',theme:'rewardTheme'};
function rewardOptionText(item){const visual=item.kind==='avatar'?'':(item.visual?' · '+item.visual:'');return item.name+visual+(item.active===false?' · hors boutique':'')}
async function loadRewardCustomizer(){if(profile?.role!=='admin')return;const box=$('rewardCustomizer'),state=$('rewardState');box.classList.remove('hidden');state.className='rewardState';state.textContent='Chargement des options…';for(const id of Object.values(rewardSelectIds)){const select=$(id);if(select){select.disabled=true;select.innerHTML='<option>Chargement…</option>'}}try{const [catalogRes,equipmentRes]=await Promise.all([db.from('reward_catalog').select('id,name,kind,visual,price,active').order('price'),db.from('reward_equipment').select('kind,item_id').eq('user_id',session.user.id)]);if(catalogRes.error)throw catalogRes.error;if(equipmentRes.error)throw equipmentRes.error;rewardCatalog=catalogRes.data||[];rewardEquipment=equipmentRes.data||[];for(const [kind,id] of Object.entries(rewardSelectIds)){const select=$(id);if(!select)continue;const current=rewardEquipment.find(x=>x.kind===kind)?.item_id||'';const rows=rewardCatalog.filter(x=>x.kind===kind&&(x.active||x.id===current));select.innerHTML='<option value="">Aucun</option>'+rows.map(x=>'<option value="'+esc(x.id)+'">'+esc(rewardOptionText(x))+'</option>').join('');select.value=current||'';select.disabled=false}state.className='rewardState ok';state.textContent=rewardCatalog.length?'✓ Options chargées · '+rewardCatalog.filter(x=>x.active).length+' élément(s) disponible(s).':'Aucun élément de personnalisation n’est configuré.';await paintAvatar(profile?.avatar_path)}catch(error){console.error('Personnalisation avancée',error);for(const id of Object.values(rewardSelectIds)){const select=$(id);if(select){select.disabled=true;select.innerHTML='<option>Indisponible</option>'}}state.className='rewardState err';state.textContent='Impossible de charger les options : '+(error?.message||'erreur inconnue')}}
async function equipReward(kind,itemId){if(profile?.role!=='admin')return;const state=$('rewardState'),select=$(rewardSelectIds[kind]);if(!state||!select)return;select.disabled=true;state.className='rewardState';state.textContent='Application…';try{const {error}=await db.rpc('reward_equip',{p_kind:kind,p_item:itemId||null});if(error)throw error;state.className='rewardState ok';state.textContent='✓ Personnalisation appliquée.';window.NettoSounds?.play?.('success');await loadRewardCustomizer();window.dispatchEvent(new Event('netto:rewards'));await window.NettoProfileUI?.refresh?.()}catch(error){console.error('Équipement récompense',error);state.className='rewardState err';state.textContent='Erreur : '+(error?.message||'application impossible');window.NettoSounds?.play?.('error');await loadRewardCustomizer()}finally{select.disabled=false}}

function toggleMenu(e){e?.stopPropagation();$('nMenu').classList.toggle('hidden')}document.addEventListener('click',e=>{if(!e.target.closest('.nMenuWrap'))$('nMenu').classList.add('hidden')});
function currentTheme(){return document.documentElement.dataset.theme==='dark'?'dark':'light'}function applyTheme(t){t=t==='dark'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('nettoTheme',t);const ts=$('themeSelect');if(ts)ts.value=t;document.querySelectorAll('.themeIcon').forEach(x=>x.textContent=t==='dark'?'☀':'☾');document.querySelectorAll('.themeLabel').forEach(x=>x.textContent=t==='dark'?'Mode clair':'Mode sombre');document.querySelectorAll('.themeSub').forEach(x=>x.textContent=t==='dark'?'Revenir au thème clair':'Passer au thème sombre')}function toggleTheme(e){e?.stopPropagation();window.NettoSounds?.play?.('switch');applyTheme(currentTheme()==='dark'?'light':'dark')}
async function logout(){
 window.NettoSounds?.play?.('logout');await new Promise(r=>setTimeout(r,390));
 try{const sub=await currentPushSubscription();if(sub){try{await db.functions.invoke('planning-push',{body:{action:'unsubscribe',endpoint:sub.endpoint}})}catch(_){}await sub.unsubscribe()}}catch(_){}
 await db.auth.signOut({scope:'local'});location.href='index.html'
}
function syncAdminProfileWidgets(role){
 const isAdmin=role==='admin';
 document.querySelectorAll('.adminOnlyProfileWidget').forEach(el=>el.classList.toggle('hidden',!isAdmin));
 return isAdmin
}
async function boot(){const {data:{session:s}}=await db.auth.getSession();session=s;if(!s)return location.replace('index.html');const {data:p,error}=await db.from('profiles').select('display_name,role,avatar_path,profile_color,avatar_frame,ui_preferences').eq('id',s.user.id).maybeSingle();if(error||!p)return location.replace('index.html');profile=p;const savedTheme=p.ui_preferences?.theme==='dark'||p.ui_preferences?.theme==='light'?p.ui_preferences.theme:currentTheme();$('displayName').textContent=p.display_name||'Utilisateur';$('role').textContent=window.NettoProfileUI?.roleLabel?.(p.role)||({admin:'Administrateur',responsable:'Responsable',lecture:'Lecture seule',employe:'Employé'})[p.role]||p.role||'';$('readonlyProfileName').textContent=p.display_name||'Utilisateur';selectProfileColor(p.profile_color||'#FF301F',true);await paintAvatar(p.avatar_path);syncAvatarButtons();applyTheme(savedTheme);const isAdmin=syncAdminProfileWidgets(p.role);await loadRecoveryEmailStatus();if(isAdmin){syncSoundSettings();await loadNotifications();await loadRewardCustomizer()}}

window.addEventListener('netto:profile',async e=>{const fresh=e.detail?.profile;if(!fresh||!profile)return;const wasAdmin=profile.role==='admin';profile={...profile,...fresh};$('displayName').textContent=profile.display_name||'Utilisateur';$('readonlyProfileName').textContent=profile.display_name||'Utilisateur';$('role').textContent=window.NettoProfileUI?.roleLabel?.(profile.role)||profile.role||'';const isAdmin=syncAdminProfileWidgets(profile.role);if(isAdmin&&!wasAdmin){syncSoundSettings();await loadNotifications();await loadRewardCustomizer()}await paintAvatar(profile.avatar_path)});
boot();
</script><script>
