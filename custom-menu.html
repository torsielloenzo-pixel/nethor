<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('nettoTheme')||'light'}catch(_){}})();</script>
<title>Nethor — Menu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="profile-ui.js?v=83"></script>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/app-icon-v59.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/app-icon-mobile-v71.svg?v=72">
<link rel="stylesheet" href="design-v2.css?v=3"><link rel="stylesheet" href="design-v3.css?v=3"><link rel="stylesheet" href="design-v4.css?v=2">
<style>
:root{--menu:#ff2f1f;--accent:#ff8500;--grad:linear-gradient(135deg,var(--menu),var(--accent))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182235;background:radial-gradient(circle at 0 15%,color-mix(in srgb,var(--menu) 7%,transparent),transparent 26%),radial-gradient(circle at 100% 90%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 30%),linear-gradient(135deg,#f6f7f9,#fff 52%,#f2f4f6)}
button{font:inherit}header{height:70px;background:#ffffffef;border-bottom:1px solid #e4e6e9;box-shadow:0 5px 20px #00000008;display:flex;align-items:center;position:sticky;top:0;z-index:40;backdrop-filter:blur(18px)}header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad)}.top{width:min(94vw,1040px);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;border:0;border-radius:11px;background:var(--grad);color:#fff;font-size:20px;font-weight:950;display:grid;place-items:center}.title{font-size:18px;font-weight:900}.sub{font-size:10px;color:#888;margin-top:2px}
main{width:min(92vw,1040px);margin:auto;padding:54px 0 70px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;margin-bottom:26px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--menu)}h1{font-size:38px;line-height:1.05;margin:7px 0 9px;letter-spacing:-1.2px}.lead{margin:0;color:#777;font-size:13px;line-height:1.55;max-width:650px}.heroVisual{width:110px;height:110px;border-radius:28px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:42px;font-weight:950;box-shadow:0 18px 42px color-mix(in srgb,var(--menu) 20%,transparent);overflow:hidden}.heroVisual img{width:100%;height:100%;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{position:relative;min-height:220px;background:#fff;border:1px solid #e3e5e9;border-radius:20px;padding:20px;display:flex;flex-direction:column;text-align:left;cursor:pointer;box-shadow:0 9px 28px #1822350b;overflow:hidden;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--card,var(--menu)),var(--accent))}.card:hover{transform:translateY(-3px);box-shadow:0 16px 38px #00000014;border-color:color-mix(in srgb,var(--card,var(--menu)) 35%,#ddd)}.icon{width:46px;height:46px;border-radius:13px;background:color-mix(in srgb,var(--card,var(--menu)) 10%,#fff);color:var(--card,var(--menu));display:grid;place-items:center;font-size:21px;font-weight:900;margin-bottom:22px}.card h2{font-size:20px;margin:0 0 8px;letter-spacing:-.35px}.card p{font-size:11px;line-height:1.55;color:#777;margin:0 0 18px;flex:1}.foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid #eef0f2;font-size:9px;font-weight:850;color:#777}.arrow{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card,var(--menu));color:#fff;font-size:14px}.empty{padding:34px 20px;border:1px dashed #d7dade;border-radius:18px;text-align:center;color:#8a8d93;font-size:11px;grid-column:1/-1}
:root[data-theme="dark"] body{background:#111317;color:#f4f5f7}:root[data-theme="dark"] header{background:#17191df0;border-color:#2d3036}:root[data-theme="dark"] .card{background:#1b1d22;border-color:#30333a}:root[data-theme="dark"] .card p,:root[data-theme="dark"] .lead{color:#a5a8ae}:root[data-theme="dark"] .foot{border-color:#30333a;color:#999}:root[data-theme="dark"] .icon{background:#24272d}
@media(max-width:860px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){header{height:66px}.top{width:calc(100% - 24px)}main{width:calc(100% - 24px);padding-top:34px}.hero{grid-template-columns:1fr}.heroVisual{width:82px;height:82px;border-radius:22px;grid-row:1}.heroText{grid-row:2}h1{font-size:31px}.grid{grid-template-columns:1fr}.card{min-height:185px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><button class="mark" onclick="location.href='home.html'">N</button><div><div id="headerTitle" class="title">Menu</div><div id="headerSub" class="sub">Espace personnalisé</div></div></div></div></header>
<main><section class="hero"><div class="heroText"><div id="eyebrow" class="eyebrow">ESPACE</div><h1 id="menuTitle">Chargement…</h1><p id="menuDescription" class="lead"></p></div><div id="heroVisual" class="heroVisual">◆</div></section><section id="items" class="grid"></section></main>
<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function cleanColor(v,f){return /^#[0-9a-f]{6}$/i.test(String(v||''))?v:f}
function safeUrl(v){const s=String(v||'').trim();return /^\s*(javascript|data|vbscript):/i.test(s)?'':s}
async function boot(){
 const id=new URLSearchParams(location.search).get('id')||'';
 const {data:{session}}=await db.auth.getSession();if(!session)return location.replace('index.html');
 const [{data:profile},{data:row}]=await Promise.all([db.from('profiles').select('display_name,role').eq('id',session.user.id).maybeSingle(),db.from('app_settings').select('value').eq('key','site_config').maybeSingle()]);
 if(!profile)return location.replace('index.html');
 const cfg=row?.value||{},menu=(Array.isArray(cfg.customMenus)?cfg.customMenus:[]).find(x=>x.id===id);
 if(!menu||menu.enabled===false||!(Array.isArray(menu.roles)?menu.roles:[]).includes(profile.role))return location.replace('home.html');
 const primary=cleanColor(menu.color,cfg.theme?.primary||'#ff2f1f'),accent=cleanColor(menu.accent,cfg.theme?.secondary||'#ff8500');
 document.documentElement.style.setProperty('--menu',primary);document.documentElement.style.setProperty('--accent',accent);
 document.title='Nethor — '+(menu.label||'Menu');$('headerTitle').textContent=menu.label||'Menu';$('headerSub').textContent=menu.subtitle||'Espace personnalisé';$('eyebrow').textContent=menu.kicker||'ESPACE';$('menuTitle').textContent=menu.label||'Menu';$('menuDescription').textContent=menu.description||menu.subtitle||'';
 const visual=$('heroVisual');if(menu.image_url){visual.innerHTML='<img src="'+esc(menu.image_url)+'" alt="">'}else visual.textContent=menu.icon||'◆';
 const items=(Array.isArray(menu.items)?menu.items:[]).filter(x=>x&&x.enabled!==false&&(!Array.isArray(x.roles)||x.roles.includes(profile.role)));
 if(!items.length){$('items').innerHTML='<div class="empty">Aucun élément disponible dans ce menu pour le moment.</div>';return}
 $('items').innerHTML=items.map(it=>{const color=cleanColor(it.color,primary),url=safeUrl(it.url);return '<button class="card" style="--card:'+esc(color)+'" data-url="'+esc(url)+'"><div class="icon">'+esc(it.icon||'→')+'</div><h2>'+esc(it.label||'Élément')+'</h2><p>'+esc(it.description||'')+'</p><div class="foot"><span>Ouvrir</span><span class="arrow">→</span></div></button>'}).join('');
 document.querySelectorAll('.card[data-url]').forEach(b=>b.onclick=()=>{if(b.dataset.url)location.href=b.dataset.url})
}
boot();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
</body></html>
