function safeSource(){
 const raw=new URLSearchParams(location.search).get('from')||'home.html';
 try{
  const u=new URL(raw,location.href);
  if(u.origin!==location.origin)return'home.html';
  const file=(u.pathname.split('/').pop()||'home.html').replace(/[^a-zA-Z0-9._-]/g,'');
  return file+(u.search||'')
 }catch(_){return'home.html'}
}
const launchSourcePath=safeSource();
let selectedSourcePath=launchSourcePath,sourceManuallyChanged=false;
const pageNames={
 'general':'Nethor / Général',
 'home.html':'Accueil','index.html':'Stock Fruits & Légumes','planning.html':'Planning','chat.html':'Chat',
 'profile.html':'Mon profil','articles.html':'Fiches articles','bakery.html':'Boulangerie','settings.html':'Personnalisation',
 'notifications.html':'Notifications','notification-settings.html':'Réglages des notifications','scanner.html':'Scanner (bêta)',

 'rewards.html':'Défis & Boutique','accounts.html':'Comptes','admin-portal.html':'Gestion','user-menu.html':'Menu utilisateur'
};
const pageIdByFile={
 'home.html':'home','index.html':'stock','planning.html':'planning','chat.html':'chat','profile.html':'profile',
 'articles.html':'articles','bakery.html':'bakery','settings.html':'settings','notifications.html':'notifications',

 'admin-portal.html':'portal_admin'
};
function sourceFile(raw=selectedSourcePath){return String(raw||'general').split('?')[0]||'general'}
function sourceTitle(raw=selectedSourcePath){
 const file=sourceFile(raw),id=pageIdByFile[file],p=id?siteConfig?.pages?.[id]:null;
 return String(p?.nav_label||p?.label||pageNames[file]||file||'Nethor')
}
function pageSelectable(file){
 if(file==='general'||file==='user-menu.html'||file==='report-problem.html')return true;
 const id=pageIdByFile[file],cfg=id?siteConfig?.pages?.[id]:null,role=profile?.role||'';
 if(cfg?.enabled===false&&file!==sourceFile(launchSourcePath))return false;
 const explicit=id?siteConfig?.role_permissions?.[id]?.[role]:null;
 if(['none','view','operate','manage'].includes(explicit))return explicit!=='none'||file===sourceFile(launchSourcePath);
 if(Array.isArray(cfg?.roles))return cfg.roles.includes(role)||file===sourceFile(launchSourcePath);
 const restricted={
  'fl-assistant.html':['admin','responsable'],
  'bakery.html':['admin'],
  'rewards.html':['admin'],
  'accounts.html':['admin'],
  'admin-portal.html':['admin'],
  'maintenance.html':['admin']
 };
 const roles=restricted[file];
 return !roles||roles.includes(role)||file===sourceFile(launchSourcePath)
}
function sourceOptions(){
 const order=[
  'general','home.html','user-menu.html','profile.html','settings.html',
  'planning.html','index.html','articles.html','chat.html','scanner.html',
  'notifications.html','notification-settings.html','report-problem.html',
  'fl-assistant.html','bakery.html','rewards.html','admin-portal.html','accounts.html','maintenance.html'
 ];
 return order.filter(pageSelectable)
}
function populateSourceSelect(){
 const select=$('sourceSelect');if(!select)return;
 const launchFile=sourceFile(launchSourcePath),options=sourceOptions();
 select.innerHTML=options.map(file=>'<option value="'+file.replace(/"/g,'&quot;')+'">'+sourceTitle(file).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</option>').join('');

 selectedSourcePath=initial===launchFile?launchSourcePath:initial;

 if(hint)hint.textContent=initial===launchFile&&launchFile!=='general'?'Détectée automatiquement. Tu peux choisir une autre page.':'Choisis la page ou l’espace concerné par le problème.';
 select.addEventListener('change',()=>{
  sourceManuallyChanged=true;
  selectedSourcePath=select.value||'general';
  if(hint)hint.textContent='Page sélectionnée : '+sourceTitle(selectedSourcePath)+'.'
 })
}
function problemPageAllowed(role){
 const p=siteConfig?.pages?.problem_report||{};
 if(p.enabled===false)return false;
 const explicit=siteConfig?.role_permissions?.problem_report?.[role];
 if(['none','view','operate','manage'].includes(explicit))return explicit!=='none';
 if(Array.isArray(p.roles))return p.roles.includes(role);
 return true
}

}

 try{const u=new URL(raw,location.href);return u.origin===location.origin?(u.pathname.split('/').pop()||'home.html')+(u.search||''):''}catch(_){return''}
}
function displayMode(){
 try{
  if(navigator.standalone===true)return'standalone-ios';
  for(const mode of ['fullscreen','standalone','minimal-ui'])if(matchMedia('(display-mode: '+mode+')').matches)return mode
 }catch(_){}
 return'browser'
}
function parseBrowser(ua){
 const s=String(ua||'');let m;
 if((m=s.match(/Edg\/([\d.]+)/)))return{name:'Microsoft Edge',version:m[1]};
 if((m=s.match(/OPR\/([\d.]+)/)))return{name:'Opera',version:m[1]};
 if((m=s.match(/CriOS\/([\d.]+)/)))return{name:'Chrome iOS',version:m[1]};
 if((m=s.match(/FxiOS\/([\d.]+)/)))return{name:'Firefox iOS',version:m[1]};
 if((m=s.match(/Chrome\/([\d.]+)/)))return{name:'Chrome',version:m[1]};
 if((m=s.match(/Firefox\/([\d.]+)/)))return{name:'Firefox',version:m[1]};
 if(/Safari\//.test(s)&&(m=s.match(/Version\/([\d.]+)/)))return{name:'Safari',version:m[1]};
 return{name:'Navigateur non identifié',version:null}
}
function parseOS(ua){
 const s=String(ua||'');let m;
 if(/iPhone|iPad|iPod/.test(s)&&(m=s.match(/OS ([\d_]+)/)))return'iOS '+m[1].replace(/_/g,'.');
 if((m=s.match(/Android ([^;\)]+)/)))return'Android '+m[1].trim();
 if((m=s.match(/Windows NT ([\d.]+)/)))return'Windows NT '+m[1];
 if((m=s.match(/Mac OS X ([\d_]+)/)))return'macOS '+m[1].replace(/_/g,'.');
 if(/Linux/.test(s))return'Linux';
 return'Non identifié'
}
function deviceKind(ua){
 const s=String(ua||'');
 if(/iPad|Tablet|Android(?!.*Mobile)/i.test(s))return'Tablette';
 if(navigator.userAgentData?.mobile===true||/iPhone|iPod|Android.+Mobile|Windows Phone|webOS|BlackBerry|IEMobile/i.test(s))return'Mobile';

}

  return x&&typeof x==='object'?x:null
 }catch(_){return null}
}
async function highEntropyUA(){
 try{
  if(!navigator.userAgentData?.getHighEntropyValues)return null;
  const x=await navigator.userAgentData.getHighEntropyValues(['platform','platformVersion','architecture','bitness','model','uaFullVersion','fullVersionList']);
  return {
   mobile:typeof navigator.userAgentData.mobile==='boolean'?navigator.userAgentData.mobile:null,
   brands:Array.isArray(navigator.userAgentData.brands)?navigator.userAgentData.brands:null,
   platform:x.platform||navigator.userAgentData.platform||null,
   platform_version:x.platformVersion||null,
   architecture:x.architecture||null,
   bitness:x.bitness||null,
   model:x.model||null,
   ua_full_version:x.uaFullVersion||null,
   full_version_list:Array.isArray(x.fullVersionList)?x.fullVersionList:null
  }
 }catch(_){return null}
}
async function cacheInfo(){
 try{
  if(!window.caches?.keys)return[];
  return (await caches.keys()).filter(x=>/^netto-tools-v/i.test(String(x))).slice(0,10)
 }catch(_){return[]}
}
async function collectDiagnostics(){
 const capturedWindow=NETHOR_QUICK_REPORT_EMBEDDED?window.parent:window;
 const ua=String(navigator.userAgent||''),vv=capturedWindow.visualViewport||null,conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection||null;
 const navEntry=capturedWindow.performance?.getEntriesByType?.('navigation')?.[0]||null;
 const [uaData,cacheNames]=await Promise.all([highEntropyUA(),cacheInfo()]);
 const sw=navigator.serviceWorker?.controller||null;
 let orientationType=null,orientationAngle=null;
 try{orientationType=screen.orientation?.type||null;orientationAngle=Number.isFinite(screen.orientation?.angle)?screen.orientation.angle:null}catch(_){}
 let theme=null;try{theme=localStorage.getItem('nettoTheme')||null}catch(_){}
 const browser=parseBrowser(ua);
 return {
  schema_version:2,
  captured_at:new Date().toISOString(),
  source:{
   path:selectedSourcePath,
   title:sourceTitle(selectedSourcePath),
   report_origin_path:launchSourcePath,
   report_origin_title:sourceTitle(launchSourcePath),
   manually_selected:sourceManuallyChanged,
   referrer:sameOriginPath(document.referrer)
  },
  app:{
   version:appVersionInfo?.version??null,
   label:appVersionInfo?.label||null,
   published_at:appVersionInfo?.published_at||null,
   display_mode:displayMode(),
   standalone:navigator.standalone===true||displayMode().includes('standalone'),
   service_worker_controlled:!!sw,
   service_worker_script:sameOriginPath(sw?.scriptURL||''),
   service_worker_state:sw?.state||null,
   cache_names:cacheNames,
   theme
  },
  device:{
   kind:deviceKind(ua),
   model:uaData?.model||null,
   os:parseOS(ua),
   platform:uaData?.platform||navigator.platform||null,
   platform_version:uaData?.platform_version||null,
   architecture:uaData?.architecture||null,
   bitness:uaData?.bitness||null,
   max_touch_points:Number.isFinite(navigator.maxTouchPoints)?navigator.maxTouchPoints:null,
   device_memory_gb:Number.isFinite(navigator.deviceMemory)?navigator.deviceMemory:null,
   logical_processors:Number.isFinite(navigator.hardwareConcurrency)?navigator.hardwareConcurrency:null
  },
  browser:{
   name:browser.name,
   version:browser.version,
   vendor:navigator.vendor||null,
   user_agent:ua,
   user_agent_data:uaData
  },
  display:{
   screen_width:screen.width||null,
   screen_height:screen.height||null,
   available_width:screen.availWidth||null,
   available_height:screen.availHeight||null,
   pixel_ratio:window.devicePixelRatio||1,
   color_depth:screen.colorDepth||null,
   orientation_type:orientationType,
   orientation_angle:orientationAngle,
   viewport_width:capturedWindow.innerWidth||null,
   viewport_height:capturedWindow.innerHeight||null,
   visual_viewport_width:vv?Math.round(vv.width):null,
   visual_viewport_height:vv?Math.round(vv.height):null,
   visual_viewport_scale:vv?vv.scale:null
  },
  network:{
   online:navigator.onLine,
   effective_type:conn?.effectiveType||null,
   downlink_mbps:Number.isFinite(conn?.downlink)?conn.downlink:null,
   rtt_ms:Number.isFinite(conn?.rtt)?conn.rtt:null,
   save_data:typeof conn?.saveData==='boolean'?conn.saveData:null
  },
  locale:{
   language:navigator.language||null,
   languages:Array.isArray(navigator.languages)?navigator.languages:null,
   timezone:(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||null}catch(_){return null}})(),
   utc_offset_minutes:new Date().getTimezoneOffset()
  },
  interaction:{
   pointer_coarse:matchMedia?.('(pointer:coarse)')?.matches??null,
   hover:matchMedia?.('(hover:hover)')?.matches??null,
   reduced_motion:matchMedia?.('(prefers-reduced-motion: reduce)')?.matches??null,
   color_scheme_dark:matchMedia?.('(prefers-color-scheme: dark)')?.matches??null,
   mobile_preview:new URLSearchParams(location.search).get('mobile_preview')==='1'
  },
  navigation:{
   type:navEntry?.type||null,
   duration_ms:Number.isFinite(navEntry?.duration)?Math.round(navEntry.duration):null,
   transfer_size:Number.isFinite(navEntry?.transferSize)?navEntry.transferSize:null,
   encoded_body_size:Number.isFinite(navEntry?.encodedBodySize)?navEntry.encodedBodySize:null,
   visibility_state:capturedWindow.document.visibilityState||null
  }
 }
}
async function sendReport(){
 if(sending)return;
 const description=$('problemText').value.trim();
 if(description.length<8){state('Décris un peu plus précisément le problème.','err');$('problemText').focus();return}
 sending=true;$('sendBtn').disabled=true;state('Collecte du diagnostic et envoi…');
 try{
  if(!session)throw new Error('Session indisponible');
  const diagnostics=await collectDiagnostics();
  const appVersion=appVersionInfo?.label||(appVersionInfo?.version!=null?'v'+appVersionInfo.version:null);
  const payload={
   reporter_id:session.user.id,
   reporter_name:profile?.display_name||'Utilisateur',
   reporter_role:profile?.role||null,
   description,
   source_path:selectedSourcePath.slice(0,500),
   source_title:sourceTitle(selectedSourcePath).slice(0,160),
   user_agent:String(navigator.userAgent||'').slice(0,800),
   app_version:appVersion?String(appVersion).slice(0,80):null,
   diagnostics
  };
  const {error}=await db.from('reported_problems').insert(payload);
  if(error)throw error;
  state('✓ Signalement envoyé.','ok');
  $('reportCard').classList.add('hidden');$('successCard').classList.remove('hidden');
  if(NETHOR_QUICK_REPORT_EMBEDDED){$('reportCard').hidden=true;$('successCard').hidden=false}
  try{window.NettoSounds?.play?.('success')}catch(_){}
 }catch(e){
  console.error('Signalement problème:',e);
  state('Impossible d’envoyer le problème pour le moment.','err');
  $('sendBtn').disabled=false;sending=false
 }
}
async function init(){
 if(NETHOR_QUICK_REPORT_EMBEDDED){
  // Ne jamais rendre simultanément le formulaire et la confirmation.
  $('reportCard').hidden=false;
  $('successCard').hidden=true;
  const help=document.querySelector('.rpHelp');
  if(help)help.textContent='N’indique pas de mot de passe ou d’information sensible. Un diagnostic technique sera joint.';
  const send=$('sendBtn'),close=$('returnBtn');
  if(send)send.textContent='Envoyer le signalement';
  if(close)close.textContent='Fermer';
 }
 $('cancelBtn').addEventListener('click',returnToMenu);
 $('returnBtn').addEventListener('click',returnToMenu);
 $('problemText').addEventListener('input',updateCount);
 $('sendBtn').addEventListener('click',sendReport);
 updateCount();
 const {data:{session:s}}=await db.auth.getSession();
 if(!s){location.replace('home.html');return}
 session=s;
 const [{data},{data:setting},versionInfo]=await Promise.all([
  db.from('profiles').select('display_name,role').eq('id',s.user.id).maybeSingle(),
  db.from('app_settings').select('value').eq('key','site_config').maybeSingle(),
  readAppVersion()
 ]);
 profile=data||null;siteConfig=setting?.value&&typeof setting.value==='object'?setting.value:{};appVersionInfo=versionInfo;
 if(!profile||!problemPageAllowed(profile.role)){location.replace('home.html');return}
 applyProblemPageConfig();
 populateSourceSelect()
}
init().catch(e=>{console.error(e);state('Impossible de préparer le formulaire.','err')});
</script>
