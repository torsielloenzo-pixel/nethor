<style>

.title{min-width:0;flex:1}.titleRow{display:flex;align-items:center;gap:8px;min-width:0}.title h1{margin:0;font-size:25px;line-height:1.05;letter-spacing:-.65px;white-space:nowrap}.beta{padding:5px 8px;border-radius:999px;background:#fff0e9;color:#db4c22;border:1px solid #ffd3c3;font-size:8px;font-weight:950;letter-spacing:.5px;text-transform:uppercase}.title p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.35}

.scanFrame:before,.scanFrame:after,.scanFrame i:before,.scanFrame i:after{content:"";position:absolute;width:30px;height:30px;border-color:#ff6a35;border-style:solid}
.scanFrame:before{left:0;top:0;border-width:3px 0 0 3px;border-radius:13px 0 0 0}.scanFrame:after{right:0;top:0;border-width:3px 3px 0 0;border-radius:0 13px 0 0}.scanFrame i:before{left:0;bottom:0;border-width:0 0 3px 3px;border-radius:0 0 0 13px}.scanFrame i:after{right:0;bottom:0;border-width:0 3px 3px 0;border-radius:0 0 13px 0}
.scanLine{position:absolute;left:12px;right:12px;top:50%;height:2px;background:linear-gradient(90deg,transparent,#ff7d3c,#ff3b26,#ff7d3c,transparent);box-shadow:0 0 12px #ff603d;animation:scanline 2s ease-in-out infinite}
@keyframes scanline{0%,100%{transform:translateY(-42px);opacity:.5}50%{transform:translateY(42px);opacity:1}}

.hint{display:flex;align-items:flex-start;gap:9px;margin:10px 2px 0;padding:0 3px;color:#77808b;font-size:9.5px;line-height:1.45}.hintIcon{width:21px;height:21px;flex:none;border-radius:7px;background:#fff0e8;color:#ed532a;display:grid;place-items:center;font-weight:950}.cameraPreference{display:none;align-items:center;gap:7px;margin:8px 2px 0;padding:8px 10px;border:1px solid #d8eadf;border-radius:11px;background:#f3fbf6;color:#2f7e4e;font-size:8.8px;font-weight:850;line-height:1.25}.cameraPreference.show{display:flex}.cameraPreferenceIcon{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#dff4e6;color:#268348;font-size:11px;font-weight:950;flex:none}
.panel{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:19px;background:var(--card);box-shadow:0 7px 22px #1420300a}
.panelHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.panelHead h2{margin:0;font-size:15px}.panelHead small{color:#9299a2;font-size:8px}
.manual{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.manual input{min-width:0;height:44px;border:1px solid #dfe3e7;border-radius:12px;padding:0 12px;background:#fafbfc;color:var(--ink);font-size:16px;font-weight:750;outline:none}.manual input:focus{border-color:#ff815f;box-shadow:0 0 0 3px #ff60351a}.manual button,.resultActions button{min-height:44px;border:0;border-radius:12px;padding:0 14px;font-size:10px;font-weight:900}.manual button{background:#242a31;color:#fff}

.resultModalTitle{min-width:0}.resultModalTitle strong{display:block;font-size:16px;line-height:1.1}.resultModalTitle small{display:block;margin-top:4px;color:#8b929b;font-size:9px}
.resultModalClose{width:38px;height:38px;flex:none;border:0;border-radius:12px;background:#f0f2f4;color:#343a41;display:grid;place-items:center;font-size:20px;font-weight:800}

.product{display:grid;grid-template-columns:82px minmax(0,1fr);gap:12px}.productPhoto{width:82px;height:82px;border-radius:15px;background:#f0f2f4;display:grid;place-items:center;overflow:hidden;font-size:30px}.productPhoto img{width:100%;height:100%;object-fit:cover}.productCopy{min-width:0}.productCopy h3{margin:1px 0 4px;font-size:18px;line-height:1.08}.productCopy .path{color:#7e8791;font-size:9px;line-height:1.4}.statusBadge{display:inline-flex;margin-top:7px;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:900}.statusBadge.on{background:#e8f8ed;color:#248644}.statusBadge.off{background:#fff0ec;color:#c94a2c}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.fact{padding:9px 10px;border:1px solid #eceff2;border-radius:11px;background:#f9fafb;min-width:0}.fact.wide{grid-column:1/-1}.fact span{display:block;color:#9299a2;font-size:7.5px;font-weight:850;text-transform:uppercase;letter-spacing:.45px}.fact strong{display:block;margin-top:3px;font-size:10.5px;overflow-wrap:anywhere}
.resultActions{display:grid;grid-template-columns:1fr 1.15fr;gap:8px;margin-top:12px}.resultActions .secondary{background:#eff1f3;color:#30363d}.resultActions .primary{background:var(--grad);color:#fff}
.notFoundBox{padding:16px;border:1px dashed #efb8a7;border-radius:14px;background:#fff7f3}.notFoundBox strong{display:block;font-size:14px}.notFoundBox p{margin:5px 0 0;color:#8f6e63;font-size:9.5px;line-height:1.45}

<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let scanner=null,scannerRunning=false,searchBusy=false,lastCode='',lastCodeAt=0,currentProduct=null,sessionUserId='',cameraRemembered=false,cameraPreferenceLoaded=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function cameraPreferenceKey(){return sessionUserId?'nethorScannerCamera:'+sessionUserId:'nethorScannerCamera'}
function paintCameraPreference(){
 const el=$('cameraPreference');if(el)el.classList.toggle('show',cameraRemembered)
}
function readLocalCameraPreference(){
 try{return localStorage.getItem(cameraPreferenceKey())==='1'}catch(_){return false}
}
function writeLocalCameraPreference(granted){
 try{if(granted)localStorage.setItem(cameraPreferenceKey(),'1');else localStorage.removeItem(cameraPreferenceKey())}catch(_){}
}
async function loadCameraPreference(){
 cameraRemembered=readLocalCameraPreference();
 paintCameraPreference();
 if(!sessionUserId)return cameraRemembered;
 try{
  const {data,error}=await db.from('profiles').select('ui_preferences').eq('id',sessionUserId).maybeSingle();
  if(error)throw error;
  const prefs=data?.ui_preferences&&typeof data.ui_preferences==='object'?data.ui_preferences:{};
  cameraRemembered=prefs.scanner_camera_authorized===true||cameraRemembered;
  if(cameraRemembered)writeLocalCameraPreference(true);
 }catch(e){console.warn('Préférence caméra:',e)}
 cameraPreferenceLoaded=true;paintCameraPreference();return cameraRemembered
}
async function rememberCameraPermission(granted){
 const next=granted===true;
 cameraRemembered=next;writeLocalCameraPreference(next);paintCameraPreference();
 if(!sessionUserId)return;
 try{
  const {data,error}=await db.from('profiles').select('ui_preferences').eq('id',sessionUserId).maybeSingle();
  if(error)throw error;
  const prefs=data?.ui_preferences&&typeof data.ui_preferences==='object'?{...data.ui_preferences}:{};
  if(prefs.scanner_camera_authorized===next&&(!next||prefs.scanner_camera_authorized_at))return;
  prefs.scanner_camera_authorized=next;
  if(next)prefs.scanner_camera_authorized_at=prefs.scanner_camera_authorized_at||new Date().toISOString();
  else delete prefs.scanner_camera_authorized_at;
  const {error:updateError}=await db.from('profiles').update({ui_preferences:prefs}).eq('id',sessionUserId);
  if(updateError)throw updateError
 }catch(e){console.warn('Enregistrement préférence caméra:',e)}
}
function permissionDenied(error){
 const name=String(error?.name||'').toLowerCase(),msg=String(error?.message||error||'').toLowerCase();
 return name==='notallowederror'||name==='permissiondeniederror'||msg.includes('permission denied')||msg.includes('not allowed')
}
function goBack(){
  location.href=window.NethorNavigation?.backTarget?.()||'home.html'
}
function isMobileView(){return window.NethorPlatform?.isMobile?.()??new URLSearchParams(location.search).get('mobile_preview')==='1'}
function setCameraState(text){const el=$('cameraStateText');if(el)el.textContent=text}
function showCameraFallback(message){
  $('cameraFallbackText').textContent=message||'Impossible d’ouvrir la caméra.';
  $('cameraFallback').classList.add('show');
  setCameraState('Caméra indisponible')
}
function hideCameraFallback(){$('cameraFallback').classList.remove('show')}
function normalizeEan(value){return String(value||'').replace(/\D/g,'').slice(0,14)}
function validEanLength(v){return v.length===8||v.length===12||v.length===13}
function eanCandidates(v){v=normalizeEan(v);const out=[v];if(v.length<13)out.push(v.padStart(13,'0'));return [...new Set(out.filter(Boolean))]}
function manualEanCandidates(v){
 v=normalizeEan(v);
 if(!v)return[];
 const out=[v];
 if(v.length<14)out.push('0'+v);
 if(v.length<13)out.push(v.padStart(13,'0'));
 return [...new Set(out.filter(Boolean))]
}
function safeStop(){
  if(!scanner||!scannerRunning)return Promise.resolve();
  scannerRunning=false;
  return scanner.stop().catch(()=>{}).then(()=>{try{scanner.clear()}catch(_){}});
}
function lockScannerViewport(){
 try{window.scrollTo(0,0)}catch(_){}
 const input=$('eanInput');if(input){input.blur();input.setAttribute('readonly','');input.setAttribute('tabindex','-1');input.setAttribute('inputmode','none')}
}
function activateManualInput(input,event){
 if(!input)return;
 event?.preventDefault?.();
 input.removeAttribute('readonly');
 input.setAttribute('tabindex','0');
 input.setAttribute('inputmode','numeric');
 input.focus({preventScroll:true});
 try{input.setSelectionRange(input.value.length,input.value.length)}catch(_){}
}
function resetManualInputLock(){
 const input=$('eanInput');if(!input)return;
 input.blur();input.setAttribute('readonly','');input.setAttribute('tabindex','-1');input.setAttribute('inputmode','none')
}


async function startCamera(){
  if(!isMobileView())return;
  hideCameraFallback();
  if(!window.Html5Qrcode||!window.Html5QrcodeSupportedFormats){
    showCameraFallback('Le module de lecture n’a pas pu être chargé. Tu peux saisir l’EAN13 manuellement.');
    return
  }
  await safeStop();
  try{
    scanner=new Html5Qrcode('reader',{
      formatsToSupport:[
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A
      ],
      verbose:false
    });
    setCameraState(cameraRemembered?'Ouverture de la caméra…':'Demande d’accès…');
    await scanner.start(
      {facingMode:'environment'},
      {fps:12,qrbox:(w,h)=>({width:Math.min(310,Math.max(220,w*.78)),height:Math.min(130,Math.max(100,h*.34))}),aspectRatio:1.777778,disableFlip:true},
      onScanSuccess,
      ()=>{}
    );
    scannerRunning=true;
    setCameraState('Prêt à scanner');
    if(!cameraRemembered)rememberCameraPermission(true);
  }catch(e){
    console.warn('Scanner camera:',e);
    if(permissionDenied(e)&&cameraRemembered)await rememberCameraPermission(false);
    showCameraFallback('Autorise la caméra dans les réglages du navigateur puis touche « Réessayer ».')
  }
}

async function onScanSuccess(decodedText){
  const code=normalizeEan(decodedText),now=Date.now();
  if(!validEanLength(code)||searchBusy)return;
  if(code===lastCode&&now-lastCodeAt<1800)return;
  lastCode=code;lastCodeAt=now;
  try{navigator.vibrate?.(55)}catch(_){}
  setCameraState('Code reconnu');
  await findProduct(code,true)
}

async function findProduct(raw,fromCamera=false){
  const code=normalizeEan(raw);
  $('eanInput').value=code;
  if(fromCamera&&!validEanLength(code)){
    renderNotFound(code,'Le code-barres doit contenir 8, 12 ou 13 chiffres.');
    return
  }
  if(!fromCamera&&!code){
    renderNotFound(code,'Saisis au moins un chiffre.');
    return
  }
  searchBusy=true;
  setCameraState('Recherche de la fiche…');
  const candidates=fromCamera?eanCandidates(code):manualEanCandidates(code);
  const {data,error}=await db.from('products')
    .select('id,name,ean,article_code,photo_url,on_sale,active,packaging_count,shelf_capacity,product_families(name,slug),product_categories(name),product_packagings(name)')
    .eq('active',true)
    .in('ean',candidates)
    .limit(Math.max(2,candidates.length));
  searchBusy=false;
  if(error){
    console.error(error);
    renderNotFound(code,'Impossible de rechercher la fiche pour le moment.');
    if(fromCamera)setTimeout(()=>startCamera(),1200);
    return
  }
  const rows=data||[];
  const product=candidates.map(candidate=>rows.find(p=>String(p.ean||'')===candidate)).find(Boolean)||rows[0]||null;
  if(!product){
    await safeStop();
    renderNotFound(code,'Aucune fiche article ne correspond à cet EAN13.');
    setCameraState('Article introuvable');
    return
  }
  currentProduct=product;
  await safeStop();
  renderProduct(product);
  setCameraState('Fiche trouvée')
}

function renderProduct(p){
  const family=p.product_families?.name||'Non répertorié';
  const category=p.product_categories?.name||'Non répertorié';
  const packaging=p.product_packagings?.name||'Non répertorié';
  const pack=packaging+(p.packaging_count?' · '+p.packaging_count:'');
  const result=$('result');
  result.className='result show resultModal';
  result.innerHTML=
    '<button class="resultModalBackdrop" type="button" aria-label="Fermer la fiche" onclick="closeProductModal()"></button>'+
    '<article class="resultModalCard" role="dialog" aria-modal="true" aria-labelledby="scannerProductTitle">'+
      '<div class="resultModalTop"><div class="resultModalTitle"><strong id="scannerProductTitle">Fiche article</strong><small>EAN13 reconnu par le scanner</small></div><button class="resultModalClose" type="button" onclick="closeProductModal()" aria-label="Fermer">×</button></div>'+
      '<div class="resultStatus"><span class="resultStatusDot"></span>Fiche article trouvée</div>'+
      '<div class="product">'+
        '<div class="productPhoto">'+(p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'📦')+'</div>'+
        '<div class="productCopy"><h3>'+esc(p.name||'Article')+'</h3><div class="path">'+esc(family)+' · '+esc(category)+'</div><span class="statusBadge '+(p.on_sale?'on':'off')+'">'+(p.on_sale?'EN VENTE':'HORS VENTE')+'</span></div>'+
      '</div>'+
      '<div class="facts">'+
        '<div class="fact wide"><span>EAN13</span><strong>'+esc(p.ean||'—')+'</strong></div>'+
        '<div class="fact"><span>Code article</span><strong>'+esc(p.article_code||'—')+'</strong></div>'+
        '<div class="fact"><span>Conditionnement</span><strong>'+esc(pack)+'</strong></div>'+
      '</div>'+
      '<div class="resultActions"><button class="secondary" type="button" onclick="closeProductModal()">Fermer</button><button class="primary" type="button" onclick="openArticle()">Ouvrir la fiche article</button></div>'+
    '</article>';
  resetManualInputLock()
}
function renderNotFound(code,message){
  currentProduct=null;
  $('result').className='result show';
  $('result').innerHTML=
    '<div class="resultStatus notFound"><span class="resultStatusDot"></span>Fiche introuvable</div>'+
    '<div class="notFoundBox"><strong>'+esc(code||'EAN13 non reconnu')+'</strong><p>'+esc(message||'Aucune fiche article trouvée.')+'</p></div>'+
    '<div class="resultActions"><button class="secondary" type="button" onclick="scanAnother()">Réessayer</button><button class="primary" type="button" onclick="focusManual()">Saisir un EAN13</button></div>';
  $('result').scrollTop=0
}
function closeProductModal(){
  const result=$('result');
  currentProduct=null;
  if(result){result.className='result';result.innerHTML=''}
  $('eanInput').value='';lastCode='';resetManualInputLock();
  setCameraState('Prêt à scanner');
  if(isMobileView()&&!scannerRunning)setTimeout(startCamera,90)
}
function scanAnother(){
  currentProduct=null;$('result').className='result';$('result').innerHTML='';$('eanInput').value='';lastCode='';resetManualInputLock();startCamera()
}
function focusManual(){const input=$('eanInput');if(!input)return;input.removeAttribute('readonly');input.setAttribute('tabindex','0');input.setAttribute('inputmode','numeric');input.focus({preventScroll:true});input.select()}
function manualSearch(e){e.preventDefault();safeStop().then(()=>findProduct($('eanInput').value,false))}
function openArticle(){
  if(!currentProduct?.ean)return;
  location.href='articles.html?ean='+encodeURIComponent(currentProduct.ean)+'&source=scanner'
}

function scannerPageAccess(role,cfg){
  const page=cfg.pages?.scanner&&typeof cfg.pages.scanner==='object'?cfg.pages.scanner:{};
  if(page.enabled===false)return false;
  const explicit=cfg.role_permissions?.scanner?.[role];
  if(['none','view','operate','manage'].includes(explicit))return explicit!=='none';
  if(Array.isArray(page.roles))return page.roles.includes(role);
  return true
}
function applyScannerPageConfig(cfg){
  const p=cfg?.pages?.scanner;if(!p||typeof p!=='object')return;
  const title=String(p.nav_label||p.label||'Scanner').trim()||'Scanner';
  const subtitle=String(p.subtitle||'Scanne un code-barres pour retrouver sa fiche article EAN13.').trim();
  const h1=document.querySelector('.title h1'),sub=document.querySelector('.title p');
  if(h1)h1.textContent=title;if(sub&&subtitle)sub.textContent=subtitle;
  document.title=title+' · Nethor'
}
async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(!session)return location.replace('index.html');
  const [{data:profile},{data:setting}]=await Promise.all([
    db.from('profiles').select('role').eq('id',session.user.id).maybeSingle(),
    db.from('app_settings').select('value').eq('key','site_config').maybeSingle()
  ]);
  const cfg=setting?.value&&typeof setting.value==='object'?setting.value:{};
  applyScannerPageConfig(cfg);
  if(!profile||!scannerPageAccess(profile.role,cfg))return location.replace('home.html');
  sessionUserId=session.user.id;
  if(!isMobileView())return;
  lockScannerViewport();
  await loadCameraPreference();
  lockScannerViewport();
  setTimeout(startCamera,cameraRemembered?90:160)
}
window.addEventListener('pagehide',()=>{safeStop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('result')?.classList.contains('resultModal'))closeProductModal()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)safeStop();else if(isMobileView()&&!currentProduct&&!scannerRunning)setTimeout(startCamera,180)});
document.addEventListener('gesturestart',e=>{if(isMobileView())e.preventDefault()},{passive:false});
document.addEventListener('gesturechange',e=>{if(isMobileView())e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(isMobileView()&&e.touches?.length>1)e.preventDefault()},{passive:false});
window.addEventListener('resize',()=>{if(isMobileView()&&!document.activeElement?.matches?.('#eanInput'))lockScannerViewport()});
boot();
</script>
</body>
</html>
