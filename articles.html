<dialog id="articleDialog"><form class="modal" onsubmit="saveArticle(event)"><button type="button" class="modalClose" onclick="articleDialog.close()">×</button><h2 id="articleTitle">Fiche article</h2><input id="aId" type="hidden"><div id="articleView"></div><div id="articleEdit" class="hidden"><div class="field"><label>Nom</label><input id="aName" required></div><div class="field"><label>Famille</label><select id="aFamily" onchange="refreshArticleCategories()"></select></div><div class="field"><label>Catégorie</label><select id="aCategory"></select></div><div class="two"><div class="field"><label>Conditionnement</label><select id="aPackaging"></select></div><div class="field"><label>Nombre par unité</label><input id="aPackagingCount" type="number" min="1" step="1"></div></div><div class="field"><label>Capacité rayon</label><input id="aShelfCapacity" type="number" min="0" step="1"></div><div class="two"><div class="field"><label>Code article</label><input id="aCode"></div><div class="field"><label>EAN13</label><input id="aEan" inputmode="numeric" maxlength="13" placeholder="13 chiffres"></div></div><div class="field"><label>Photo</label><input id="aPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></div><div class="field"><label>Statut du produit</label><select id="aOnSale"><option value="true">Actif</option><option value="false">Inactif</option></select></div><div class="actions"><button type="button" class="secondary" onclick="cancelArticleEdit()">Annuler</button><button class="primary">Enregistrer</button></div></div></form></dialog>

<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let profile=null,canManageArticles=false,items=[],families=[],categories=[],packagings=[],filter='all',optionType=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),attr=esc;
function currentTheme(){return document.documentElement.dataset.theme==='dark'?'dark':'light'}function applyTheme(t){t=t==='dark'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('nettoTheme',t);document.querySelectorAll('.themeIcon').forEach(x=>x.textContent=t==='dark'?'☀':'☾');document.querySelectorAll('.themeLabel').forEach(x=>x.textContent=t==='dark'?'Mode clair':'Mode sombre')}function toggleTheme(e){e?.stopPropagation();applyTheme(currentTheme()==='dark'?'light':'dark')}
function setFilter(v){filter=v;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===v));render()}
function filtered(){const q=$('search').value.trim().toLocaleLowerCase('fr');return items.filter(p=>(filter==='all'||(filter==='on'?p.on_sale:!p.on_sale))&&(!q||[p.name,p.ean,p.article_code,p.family_name,p.category_name,p.packaging_name].some(v=>String(v||'').toLocaleLowerCase('fr').includes(q))))}
function render(){
 const list=filtered();$('count').textContent=list.length;const g=$('grid');
 if(!list.length){g.innerHTML='<div class="empty">Aucune fiche article ne correspond à cette recherche.</div>';return}
 g.innerHTML=list.map(p=>{
   const family=p.family_name||'Non répertorié',cat=p.category_name||'Non répertorié',pack=p.packaging_name||'Non répertorié',missing=family==='Non répertorié'||cat==='Non répertorié';
   let stockBtn='';
   if(p.family_slug==='fruits-legumes'&&p.ean)stockBtn='<button class="openBtn" onclick="location.href=\'index.html?ean='+encodeURIComponent(p.ean)+'\'">Voir dans le stock</button>';
   else if(p.family_slug==='boulangerie'&&p.ean)stockBtn='<button class="openBtn adminStockLink" onclick="location.href=\'bakery.html?ean='+encodeURIComponent(p.ean)+'\'">Voir Boulangerie</button>';if(canManageArticles)stockBtn+='<button class="openBtn" onclick="openArticle(\''+p.id+'\')">Modifier</button>';
   return '<article class="card" data-product-id="'+attr(p.id)+'" data-ean="'+attr(p.ean||'')+'"><div class="photo">'+(p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'📦')+'</div><div class="body"><div class="statusRow"><div><div class="name">'+esc(p.name||'Article')+'</div><div class="familyLine '+(missing?'unlisted':'')+'">'+esc(family)+'</div><div class="cat '+(cat==='Non répertorié'?'unlisted':'')+'">'+esc(cat)+'</div></div><span class="badge '+(p.on_sale?'on':'off')+'">'+(p.on_sale?'ACTIF':'INACTIF')+'</span></div><div class="facts"><div class="fact ean"><span>EAN13</span><strong>'+esc(p.ean||'Non renseigné')+'</strong></div><div class="fact"><span>Code article</span><strong>'+esc(p.article_code||'—')+'</strong></div><div class="fact"><span>Conditionnement</span><strong class="'+(pack==='Non répertorié'?'unlisted':'')+'">'+esc(pack)+(p.packaging_count?' · '+esc(p.packaging_count):'')+'</strong></div></div></div><div class="foot"><div class="switchWrap"><button class="switch '+(p.on_sale?'on':'')+'" '+(canManageArticles?'':'disabled')+' onclick="toggleSale(\''+p.id+'\')" aria-label="Changer le statut du produit"></button><span>'+(p.on_sale?'Actif':'Inactif')+'</span></div>'+stockBtn+'</div></article>'
 }).join('');
 document.querySelectorAll('.adminStockLink').forEach(b=>b.classList.toggle('hidden',!canManageArticles))
}

async function loadTaxonomy(){const [f,c,p]=await Promise.all([db.from('product_families').select('*').order('position').order('name'),db.from('product_categories').select('*').order('position').order('name'),db.from('product_packagings').select('*').order('position').order('name')]);if(f.error||c.error||p.error)return alert('Référentiel indisponible');families=f.data||[];categories=c.data||[];packagings=p.data||[]}
function fillArticleSelects(familyId,categoryId,packagingId){$('aFamily').innerHTML='<option value="">Non répertorié</option>'+families.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('aFamily').value=familyId?String(familyId):'';refreshArticleCategories(categoryId);$('aPackaging').innerHTML='<option value="">Non répertorié</option>'+packagings.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('aPackaging').value=packagingId?String(packagingId):''}
function refreshArticleCategories(selected){const fid=$('aFamily').value,rows=categories.filter(x=>String(x.family_id)===String(fid));$('aCategory').innerHTML='<option value="">Non répertorié</option>'+rows.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');if(selected)$('aCategory').value=String(selected)}
function articleView(p){$('articleView').innerHTML='<div class="sheetView"><div><small>Nom</small><strong>'+esc(p.name)+'</strong></div><div><small>Famille / catégorie</small><strong>'+esc(p.family_name)+' • '+esc(p.category_name)+'</strong></div><div><small>Conditionnement</small><strong>'+esc(p.packaging_name)+(p.packaging_count?' · '+esc(p.packaging_count):'')+'</strong></div><div><small>EAN13 / code article</small><strong>'+esc(p.ean||'—')+' / '+esc(p.article_code||'—')+'</strong></div></div><div class="actions"><button type="button" class="editBtn primary" onclick="setArticleEdit(true)">✎ Modifier la fiche</button></div>'}
function setArticleEdit(edit){$('articleView').classList.toggle('hidden',edit);$('articleEdit').classList.toggle('hidden',!edit)}
function openArticle(id){if(!canManageArticles)return;const p=items.find(x=>x.id===id);if(!p)return;$('articleTitle').textContent='Fiche article';$('aId').value=p.id;$('aName').value=p.name||'';fillArticleSelects(p.family_id,p.category_id,p.packaging_id);$('aPackagingCount').value=p.packaging_count||'';$('aShelfCapacity').value=p.shelf_capacity??'';$('aCode').value=p.article_code||'';$('aEan').value=p.ean||'';$('aOnSale').value=String(p.on_sale!==false);$('aPhoto').value='';articleView(p);setArticleEdit(false);$('articleDialog').showModal()}
function openCreate(){if(!canManageArticles)return;$('articleTitle').textContent='Créer une fiche article';$('aId').value='';$('aName').value='';fillArticleSelects(null,null,null);$('aPackagingCount').value='';$('aShelfCapacity').value='';$('aCode').value='';$('aEan').value='';$('aOnSale').value='true';$('aPhoto').value='';$('articleView').classList.add('hidden');$('articleEdit').classList.remove('hidden');$('articleDialog').showModal()}
function cancelArticleEdit(){if($('aId').value){const p=items.find(x=>x.id===$('aId').value);if(p){articleView(p);setArticleEdit(false)}}else $('articleDialog').close()}
async function saveArticle(e){e.preventDefault();if(!canManageArticles)return;try{const id=$('aId').value,current=items.find(x=>x.id===id);let photoUrl=current?.photo_url||null,file=$('aPhoto').files[0];if(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''),path=crypto.randomUUID()+'.'+ext;const {error:up}=await db.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:false});if(up)throw up;photoUrl=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}const rawEan=$('aEan').value.replace(/\D/g,'');if(rawEan.length>13)throw new Error('L’EAN13 doit contenir au maximum 13 chiffres.');const ean=rawEan?rawEan.padStart(13,'0'):'';const pc=Number($('aPackagingCount').value),sr=$('aShelfCapacity').value.trim(),sc=sr===''?null:Number(sr),payload={name:$('aName').value.trim(),family_id:$('aFamily').value?Number($('aFamily').value):null,category_id:$('aCategory').value?Number($('aCategory').value):null,packaging_id:$('aPackaging').value?Number($('aPackaging').value):null,packaging_count:Number.isInteger(pc)&&pc>=1?pc:null,shelf_capacity:Number.isInteger(sc)&&sc>=0?sc:null,article_code:$('aCode').value.trim()||null,ean:ean||null,photo_url:photoUrl,on_sale:$('aOnSale').value==='true'};let q;if(id)q=db.from('products').update(payload).eq('id',id);else q=db.from('products').insert({...payload,quantity:0,active:true,position:items.reduce((m,p)=>Math.max(m,Number(p.position)||0),0)+1});const {error}=await q;if(error){if(error.code==='23505')throw new Error('Cet EAN13 est déjà utilisé.');throw error}$('articleDialog').close();await load()}catch(err){alert('Enregistrement impossible : '+err.message)}}
function slugifyFamily(v){return String(v||'').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'-et-').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function openOptions(kind){if(!canManageArticles)return;optionType=kind;$('optionsTitle').textContent=kind==='family'?'Familles':kind==='category'?'Catégories':'Conditionnements';$('optionLabel').textContent=kind==='family'?'Nouvelle famille':kind==='category'?'Nouvelle catégorie':'Nouveau conditionnement';$('optionFamilyWrap').classList.toggle('hidden',kind!=='category');$('optionFamily').innerHTML=families.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('optionName').value='';renderOptions();$('optionsDialog').showModal()}
function optionRows(){return optionType==='family'?families:optionType==='packaging'?packagings:categories.filter(x=>String(x.family_id)===String($('optionFamily').value))}
function renderOptions(){const rows=optionRows();$('optionsList').innerHTML=rows.length?rows.map(x=>'<div class="optionRow"><input value="'+esc(x.name)+'"><button class="secondary" onclick="renameOption('+x.id+',this.previousElementSibling.value)">Renommer</button><button class="danger" onclick="deleteOption('+x.id+',\''+String(x.name).replace(/'/g,"\\'")+'\')">Supprimer</button></div>').join(''):'<div class="empty">Aucun élément.</div>'}
async function addOption(){const name=$('optionName').value.trim();if(!name)return;let q;if(optionType==='family')q=db.from('product_families').insert({name,slug:slugifyFamily(name),icon:'📦',color:'#777777',position:(families.length+1)*10,admin_only:true,stock_enabled:true});else if(optionType==='category')q=db.from('product_categories').insert({family_id:Number($('optionFamily').value),name,icon:'📦',color:'#777777',position:(categories.length+1)*10});else q=db.from('product_packagings').insert({name,position:(packagings.length+1)*10});const {error}=await q;if(error)return alert('Ajout impossible : '+error.message);await loadTaxonomy();$('optionName').value='';renderOptions();await load()}
async function renameOption(id,name){name=String(name||'').trim();if(!name)return;const table=optionType==='family'?'product_families':optionType==='category'?'product_categories':'product_packagings';const {error}=await db.from(table).update({name}).eq('id',id);if(error)return alert('Modification impossible : '+error.message);await loadTaxonomy();renderOptions();await load()}
async function deleteOption(id,name){const label=optionType==='family'?'famille':optionType==='category'?'catégorie':'conditionnement';if(!confirm('Supprimer '+label+' « '+name+' » ?\n\nLes articles concernés restent enregistrés et passent en « Non répertorié ».'))return;const table=optionType==='family'?'product_families':optionType==='category'?'product_categories':'product_packagings';const {error}=await db.from(table).delete().eq('id',id);if(error)return alert('Suppression impossible : '+error.message);await loadTaxonomy();renderOptions();await load()}

async function toggleSale(id){if(!canManageArticles)return;const p=items.find(x=>x.id===id);if(!p)return;const next=!p.on_sale;const {error}=await db.from('products').update({on_sale:next}).eq('id',id);if(error)return alert('Modification impossible : '+error.message);p.on_sale=next;render()}
async function load(){const {data,error}=await db.from('products').select('id,name,category,category_id,family_id,packaging,packaging_id,photo_url,article_code,ean,packaging_count,shelf_capacity,on_sale,active,product_families(id,name,slug),product_categories(id,name),product_packagings(id,name)').eq('active',true).order('name');if(error){$('grid').innerHTML='<div class="empty">Impossible de charger les fiches articles.</div>';return}items=(data||[]).map(p=>({...p,family_name:p.product_families?.name||'Non répertorié',family_slug:p.product_families?.slug||'',category_name:p.category_id?(p.product_categories?.name||p.category||'Non répertorié'):'Non répertorié',packaging_name:p.packaging_id?(p.product_packagings?.name||p.packaging||'Non répertorié'):'Non répertorié'}));render()}
function requestedArticleEan(){return String(new URLSearchParams(location.search).get('ean')||'').replace(/\D/g,'')}
function applyEanDeepLink(){
 const ean=requestedArticleEan();if(!ean)return;
 const p=items.find(x=>String(x.ean||'').replace(/\D/g,'')===ean);if(!p)return;
 filter='all';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));
 $('search').value=p.ean||ean;render();
 const card=document.querySelector('.card[data-product-id="'+CSS.escape(String(p.id))+'"]');
 if(card){card.classList.add('scanTarget');requestAnimationFrame(()=>card.scrollIntoView({behavior:'smooth',block:'center'}));setTimeout(()=>card.classList.remove('scanTarget'),3200)}
 if(canManageArticles)setTimeout(()=>openArticle(p.id),260)
}
async function logout(){await db.auth.signOut({scope:'local'});location.href='index.html'}
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session)return location.replace('index.html');const {data:p,error}=await db.from('profiles').select('display_name,email,role').eq('id',session.user.id).maybeSingle();if(error||!p)return location.replace('index.html');profile=p;await window.NettoProfileUI?.refresh?.();const permission=window.NettoProfileUI?.permissionLevel?.('articles',p)||'none';if(permission==='none')return location.replace('home.html');canManageArticles=permission==='manage';$('adminHub').classList.toggle('hidden',p.role!=='admin');applyTheme(currentTheme());await loadTaxonomy();await load();applyEanDeepLink()}
boot();
</script>
</body></html>
