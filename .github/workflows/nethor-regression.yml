name: Nethor — Tests de fiabilité

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability:
    name: Tests non destructifs — Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Préparer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valider la syntaxe des scripts critiques
        run: |
          node --check ui/mobile/mobile-offline-store.js
          node --check ui/mobile/mobile-sync.js
          node --check ui/mobile/mobile-services.js
          node --check ui/mobile/mobile-app.js
          node --check runtime/promotions-parser.js
          node --check runtime/promotions-page.js
          node --check ui/desktop/desktop-shell.js
          node --check auth/auth-login.js
          node --check ui/mobile/views/home/home-view.js
          node --check ui/mobile/views/surveys/surveys-view.js
          node --check ui/mobile/views/user-menu/user-menu-view.js
          node --check planning-runtime.js
          node --check chat-v2.js
          node --check runtime/client-health.js
          node --check runtime/client-health-admin.js
          node --check runtime/admin-portal-runtime.js
          node --check sw.js
          node --check runtime/home-runtime.js
          node --check runtime/desktop-home-dashboard.js
          node --check runtime/admin-portal-runtime.js
      - name: Exécuter la suite de non-régression
        run: node --test tests/phase5-regression.test.cjs tests/phase6-offline.test.cjs tests/weekly-polls-regression.test.cjs tests/desktop-quick-planning-readability.test.cjs tests/desktop-quick-report-modal.test.cjs tests/desktop-aside-widgets-readability.test.cjs tests/mobile-auth-animation-exclusivity.test.cjs tests/mobile-planning-week-header-theme.test.cjs tests/mobile-theme-polish.test.cjs tests/promotions-catalog-import.test.cjs
