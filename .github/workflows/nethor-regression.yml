name: Nethor — Tests de fiabilité

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability:
    name: Tests non destructifs — Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Préparer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valider la syntaxe des scripts critiques
        run: |
          node --check ui/mobile/mobile-offline-store.js
          node --check ui/mobile/mobile-sync.js
          node --check ui/mobile/mobile-services.js
          node --check ui/mobile/mobile-app.js
          node --check runtime/promotions-parser.js
          node --check runtime/promotions-block-analyzer.js
          node --check runtime/promotions-ocr.js
          node --check runtime/promotions-page.js
          node --check runtime/promotions-visual-engine.js
          node --check runtime/promotions-local-engine.js
          node --check runtime/promotions-review-workshop.js
          node --check runtime/promotions-offer-intelligence.js
          node --check runtime/promotions-feedback.js
          node --check ui/desktop/desktop-shell.js
          node --check auth/auth-login.js
          node --check ui/mobile/views/home/home-view.js
          node --check ui/mobile/views/surveys/surveys-view.js
          node --check ui/mobile/views/user-menu/user-menu-view.js
          node --check planning-runtime.js
          node --check chat-v2.js
          node --check runtime/client-health.js
          node --check runtime/client-health-admin.js
          node --check runtime/admin-portal-runtime.js
          node --check sw.js
          node --check runtime/home-runtime.js
          node --check runtime/desktop-home-dashboard.js
          node --check runtime/admin-portal-runtime.js
      - name: Exécuter la suite de non-régression
        run: node --test tests/phase5-regression.test.cjs tests/phase6-offline.test.cjs tests/weekly-polls-regression.test.cjs tests/desktop-quick-planning-readability.test.cjs tests/desktop-quick-report-modal.test.cjs tests/desktop-aside-widgets-readability.test.cjs tests/desktop-display-repair.test.cjs tests/mobile-auth-animation-exclusivity.test.cjs tests/mobile-planning-week-header-theme.test.cjs tests/mobile-theme-polish.test.cjs tests/promotions-catalog-import.test.cjs tests/promotions-product-blocks.test.cjs tests/promotions-review-feedback.test.cjs tests/promotions-vision-engine.test.cjs tests/promotions-local-import.test.cjs tests/promotions-review-workshop.test.cjs tests/promotions-s41-reference.test.cjs tests/professional-refactor-qa.test.cjs tests/mobile-home-active-team.test.cjs tests/desktop-home-active-team.test.cjs tests/security-step16-proposal.test.cjs tests/security-step19-recovery-edge.test.cjs tests/security-stage24-request-link.test.cjs tests/mobile-session-revalidation.test.cjs

  isolated_postgres:
    name: Simulation révocation — PostgreSQL jetable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nethor_stage17
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nethor_stage17"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Préparer le client PostgreSQL
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Tester le SQL sur une base entièrement fictive
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: nethor_stage17
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/security/stage17-fixture.sql
          psql -v ON_ERROR_STOP=1 -f tests/security/stage18-fixture-extension.sql
          psql -v ON_ERROR_STOP=1 -f tests/security/stage17-session-guard-snapshot.sql
          psql -v ON_ERROR_STOP=1 -f tests/security/stage18-chat-helper-snapshots.sql
          node tests/security/stage17-extract-functions.cjs > "$RUNNER_TEMP/nethor-stage18-functions.sql"
          psql -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/nethor-stage18-functions.sql"
          psql -v ON_ERROR_STOP=1 -f tests/security/stage18-assertions.sql
          psql -v ON_ERROR_STOP=1 -f tests/security/stage17-assertions.sql
          psql -v ON_ERROR_STOP=1 -f tests/security/stage20-fixture.sql
          psql -v ON_ERROR_STOP=1 -f docs/security/etape20-confirmation-auth-verifiee-proposal.sql
          psql -v ON_ERROR_STOP=1 -f tests/security/stage20-assertions.sql
